<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="spawn">
  <!-- The app's mark (lucide square-terminal, verbatim) on its own badge, so
       it stays legible on a light browser tab. The PNGs in this directory are
       the maskable variant: same mark, padded into the safe zone Android
       crops to. -->
  <rect width="32" height="32" rx="7" fill="#0a0a0a"/>
  <g transform="translate(4 4)" fill="none" stroke="#f5f5f5" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="m7 11 2-2-2-2"/>
    <path d="M11 13h4"/>
    <rect width="18" height="18" x="3" y="3" rx="2" ry="2"/>
  </g>
</svg>

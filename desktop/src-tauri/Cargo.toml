[package]
name = "spawn-desktop"
version = "0.1.2"
description = "SPAWN D desktop companion"
authors = ["SPAWN D"]
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
name = "spawn_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "spawn-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
base64 = "0.22"
dirs = "5"
ed25519-dalek = "2.2"
futures-util = "0.3"
getrandom = "0.2"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
spawnd = { path = "../../daemon" }
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-updater = "2"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "process", "rt-multi-thread", "sync", "time"] }
url = "2"
uuid = { version = "1", features = ["serde"] }
zeroize = "1"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }
webview2-com = "=0.38.2"
windows-core = "=0.61.2"

[features]
default = []
beta-updates = []

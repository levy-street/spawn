<!doctype html>
<!--
  The disk image's window, printed on the press sheet. Rendered to
  background.png (660×400 points at 2×, tagged 144 dpi so the Finder draws it
  at its logical size) by `npm run dmg:background`; the icon positions match
  `bundle.macOS.dmg` in tauri.conf.json, which is why the arrow lands where
  it does. Assets are the app's own, so this can never drift from the app.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: "IBM Plex Sans"; font-weight: 100 700; src: url("../../src/assets/fonts/ibm-plex-sans-latin.woff2") format("woff2"); }
  @font-face { font-family: "Rowdies"; font-weight: 300; src: url("../../src/assets/fonts/rowdies-300-latin.woff2") format("woff2"); }
  html, body { margin: 0; background: #000; }
  .bg {
    position: relative; width: 660px; height: 400px; overflow: hidden;
    background: #000 url("../../src/assets/altar-ink.png") 50% 38% / cover no-repeat;
    font-family: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
    color: #f2ede2; -webkit-font-smoothing: antialiased;
  }
  .scrim { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.95) 0%, rgba(0,0,0,.84) 40%, rgba(0,0,0,.84) 60%, rgba(0,0,0,.96) 100%); }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; text-transform: uppercase; }
  .marks span { position: absolute; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 14px; color: rgba(225,30,21,.55); }
  .marks span:nth-child(1) { top: 10px; left: 14px; } .marks span:nth-child(2) { top: 10px; right: 14px; }
  .marks span:nth-child(3) { bottom: 10px; left: 14px; } .marks span:nth-child(4) { bottom: 10px; right: 14px; }
  .lockup { position: absolute; top: 30px; left: 36px; display: flex; align-items: center; gap: 12px; color: #e11e15; }
  .trident { width: 26px; aspect-ratio: 1; background: url("../../src/assets/spawnd-icon.svg") center / contain no-repeat; }
  .wordmark { height: 20px; aspect-ratio: 1753 / 370; background: currentColor; -webkit-mask: url("../../src/assets/spawnd-wordmark.svg") left center / contain no-repeat; }
  .eyebrow { position: absolute; top: 33px; right: 36px; font-size: 11px; letter-spacing: .3em; color: #e11e15; }
  .title { position: absolute; top: 74px; left: 36px; margin: 0; font-family: "Rowdies", sans-serif; font-weight: 300; font-size: 26px; line-height: 1.04; text-transform: uppercase; color: #f2ede2; }
  .arrow { position: absolute; left: 258px; top: 156px; width: 144px; height: 28px; }
  .caption { position: absolute; top: 300px; left: 0; right: 0; text-align: center; font-size: 11px; letter-spacing: .22em; color: #a39a8c; }
  .colophon { position: absolute; bottom: 30px; left: 36px; right: 36px; display: flex; justify-content: space-between; font-size: 10px; letter-spacing: .18em; color: rgba(163,154,140,.75); }
</style>
</head>
<body>
<div class="bg">
  <div class="scrim"></div>
  <div class="marks" aria-hidden="true"><span>+</span><span>+</span><span>+</span><span>+</span></div>
  <div class="lockup"><span class="trident"></span><span class="wordmark"></span></div>
  <div class="eyebrow mono">The Mac companion</div>
  <h1 class="title">Possess this Mac<br>in two minutes.</h1>
  <svg class="arrow" viewBox="0 0 144 28" fill="none" stroke="#e11e15" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M4 14h124" /><path d="m118 4 12 10-12 10" />
  </svg>
  <div class="caption mono">Drag SPAWN D into Applications, then open it from Launchpad</div>
  <div class="colophon mono"><span>consensual · auditable · revocable</span><span>spawnd.dev</span></div>
</div>
</body>
</html>

/**
 *  Default styles for xterm.js
 */

.xterm {
    cursor: text;
    position: relative;
    user-select: none;
    -ms-user-select: none;
    -webkit-user-select: none;
}

.xterm.focus,
.xterm:focus {
    outline: none;
}

.xterm .xterm-helpers {
    position: absolute;
    top: 0;
    /**
     * The z-index of the helpers must be higher than the canvases in order for
     * IMEs to appear on top.
     */
    z-index: 5;
}

.xterm .xterm-helper-textarea {
    padding: 0;
    border: 0;
    margin: 0;
    /* Move textarea out of the screen to the far left, so that the cursor is not visible */
    position: absolute;
    opacity: 0;
    left: -9999em;
    top: 0;
    width: 0;
    height: 0;
    z-index: -5;
    /** Prevent wrapping so the IME appears against the textarea at the correct position */
    white-space: nowrap;
    overflow: hidden;
    resize: none;
}

.xterm .composition-view {
    /* TODO: Composition position got messed up somewhere */
    background: #000;
    color: #FFF;
    display: none;
    position: absolute;
    white-space: nowrap;
    z-index: 1;
}

.xterm .composition-view.active {
    display: block;
}

.xterm .xterm-viewport {
    /* On OS X this is required in order for the scroll bar to appear fully opaque */
    background-color: #000;
    overflow-y: scroll;
    cursor: default;
    position: absolute;
    right: 0;
    left: 0;
    top: 0;
    bottom: 0;
}

.xterm .xterm-screen {
    position: relative;
}

.xterm .xterm-screen canvas {
    position: absolute;
    left: 0;
    top: 0;
}

.xterm .xterm-scroll-area {
    visibility: hidden;
}

.xterm-char-measure-element {
    display: inline-block;
    visibility: hidden;
    position: absolute;
    top: 0;
    left: -9999em;
    line-height: normal;
}

.xterm.enable-mouse-events {
    /* When mouse events are enabled (eg. tmux), revert to the standard pointer cursor */
    cursor: default;
}

.xterm.xterm-cursor-pointer,
.xterm .xterm-cursor-pointer {
    cursor: pointer;
}

.xterm.column-select.focus {
    /* Column selection mode */
    cursor: crosshair;
}

.xterm .xterm-accessibility:not(.debug),
.xterm .xterm-message {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    right: 0;
    z-index: 10;
    color: transparent;
    pointer-events: none;
}

.xterm .xterm-accessibility-tree:not(.debug) *::selection {
  color: transparent;
}

.xterm .xterm-accessibility-tree {
  user-select: text;
  white-space: pre;
}

.xterm .live-region {
    position: absolute;
    left: -9999px;
    width: 1px;
    height: 1px;
    overflow: hidden;
}

.xterm-dim {
    /* Dim should not apply to background, so the opacity of the foreground color is applied
     * explicitly in the generated class and reset to 1 here */
    opacity: 1 !important;
}

.xterm-underline-1 { text-decoration: underline; }
.xterm-underline-2 { text-decoration: double underline; }
.xterm-underline-3 { text-decoration: wavy underline; }
.xterm-underline-4 { text-decoration: dotted underline; }
.xterm-underline-5 { text-decoration: dashed underline; }

.xterm-overline {
    text-decoration: overline;
}

.xterm-overline.xterm-underline-1 { text-decoration: overline underline; }
.xterm-overline.xterm-underline-2 { text-decoration: overline double underline; }
.xterm-overline.xterm-underline-3 { text-decoration: overline wavy underline; }
.xterm-overline.xterm-underline-4 { text-decoration: overline dotted underline; }
.xterm-overline.xterm-underline-5 { text-decoration: overline dashed underline; }

.xterm-strikethrough {
    text-decoration: line-through;
}

.xterm-screen .xterm-decoration-container .xterm-decoration {
	z-index: 6;
	position: absolute;
}

.xterm-screen .xterm-decoration-container .xterm-decoration.xterm-decoration-top-layer {
	z-index: 7;
}

.xterm-decoration-overview-ruler {
    z-index: 8;
    position: absolute;
    top: 0;
    right: 0;
    pointer-events: none;
}

.xterm-decoration-top {
    z-index: 2;
    position: relative;
}

html,body,#terminal{position:fixed;inset:0;width:100%;height:100%;margin:0;padding:0;overflow:hidden;touch-action:none;-webkit-text-size-adjust:none}body{overscroll-behavior:none}
/* A gutter either side so the first column does not sit on the bezel. FitAddon

.xterm{height:100%;padding:0 8px}
/* Scrolling is driven from the worker, not the browser: nothing here may pan
   on its own or the two would fight. */
.xterm-viewport{touch-action:none;overscroll-behavior:contain}
/* Selection belongs to the system, not to us. xterm ships `user-select: none`
   because on a desktop it draws its own selection over a canvas; the DOM renderer
   puts real text in the document instead, so iOS can put its own handles,
   magnifier and Copy/Look Up callout on it — which is what holding text is
   supposed to do. Only the rows opt in: the helper textarea and the cursor layer

.xterm .xterm-screen,.xterm .xterm-rows,.xterm .xterm-rows *{user-select:text;-webkit-user-select:text;-ms-user-select:text;-webkit-touch-callout:default}
.xterm .xterm-helpers,.xterm .xterm-helper-textarea,.xterm .xterm-cursor-layer{user-select:none;-webkit-user-select:none}</style>

    const pageKeys = (pixels) => {

      const pages = paged / stride;
      const whole = pages > 0 ? Math.floor(pages) : Math.ceil(pages);
      if (whole === 0) return true;
      paged -= whole * stride;

        // the one an operator makes, with xterm's own kept as the fallback.

      case "blur":
        state.term?.blur();
        return true;
      case "clipboard-response": {

        if (!pending) return true;
        clearTimeout(pending.timer);
        state.clipboardRequests.delete(message.requestId);
        if (message.error) pending.reject(new Error(message.error));
        else pending.resolve(message.text ?? undefined);
        return true;
      }
      default:
        return false;
    }
  }

  async function receiveMessage(raw) {
    let message;
    try {
      message = JSON.parse(raw);
    } catch {
      api.error("bridge_json", "Native bridge message is not valid JSON.");
      return;
    }
    if (message?.v !== BRIDGE_VERSION) {
      api.error("bridge_version", `Unsupported native bridge version: ${String(message?.v)}.`);
      return;
    }
    if (message.type === "init") {
      state.mode = message.mode;
      state.scopeId = message.scopeId;
      state.browserKey = message.browserIdentityPublicKey;
      state.hostKey = message.hostIdentityPublicKey;
      state.cols = message.cols;
      state.rows = message.rows;
      state.fontSize = message.fontSize;
      if (message.mode === "session" && !state.term) initializeTerminal(message);
      else api.post({ type: "ready", renderer: null });

          type: "diagnostic",
          diagnostic: { ...api.capability, renderer: state.renderer },
        });

    }
    if (handleSurfaceMessage(message)) return;
    try {
      await api.handleTransportMessage?.(message);
    } catch (error) {
      api.error(
        "worker_command",
        error instanceof Error ? error.message : "Worker command failed.",
      );
    }
  }

  let lastRaw = null;
  let lastRawAt = 0;
  const listener = (event) => {
    if (typeof event.data !== "string") return;
    const now = performance.now();
    if (event.data === lastRaw && now - lastRawAt < 1) return;

    lastRawAt = now;

    }
    if (bytes.byteLength > 0) {
      state.follow = true;
      state.term?.scrollToBottom();

  };

  api.bytesFromMessage = async (value) => {
    if (value instanceof ArrayBuffer) return new Uint8Array(value);

    isSecureContext: globalThis.isSecureContext === true,
    peerConnection: typeof RTCPeerConnection === "function",
    dataChannel: false,
    loopback: false,
    renderer: null,
  };

  async function probeLoopback() {
    if (!api.capability.peerConnection) {
      api.capabilityProbeComplete = true;
      api.post({ type: "diagnostic", diagnostic: { ...api.capability, renderer: state.renderer } });
      return;

    const right = new RTCPeerConnection();

      left.onicecandidate = ({ candidate }) => candidate && void right.addIceCandidate(candidate);
      right.onicecandidate = ({ candidate }) => candidate && void left.addIceCandidate(candidate);

        const timer = setTimeout(() => reject(new Error("Loopback DataChannel timed out.")), 2_000);
        right.ondatachannel = ({ channel }) => {
          channel.onopen = () => {
            clearTimeout(timer);

          };

      await left.setLocalDescription(offer);
      await right.setRemoteDescription(offer);

      await right.setLocalDescription(answer);
      await left.setRemoteDescription(answer);

    } catch (error) {
      api.capability.detail = error instanceof Error ? error.message : "Loopback probe failed.";
    } finally {
      left.close();
      right.close();
      api.capabilityProbeComplete = true;
      api.post({ type: "diagnostic", diagnostic: { ...api.capability, renderer: state.renderer } });
    }
  }

  void probeLoopback();
})();

    bindingAccepted: false,
    ptyOpen: false,
    ctlOpen: false,
    daemonReady: false,
    historyReady: false,
  };

    ready: false,
    bootstrapStarted: false,
    displaySeen: false,
    claiming: false,
    history: null,
    preboot: [],
    prebootBytes: 0,
    ptyOffset: 0,
    ptyTail: Promise.resolve(),
    ctlTail: Promise.resolve(),
    writes: [],
    writeBytes: 0,
    writeTimer: null,
    writeInFlight: false,
    stale: false,
    uploadCapability: null,
    agentGeneration: null,
    uploads: new Map(),
  };

  function resetGates() {
    for (const key of Object.keys(gates)) gates[key] = false;
    session.ready = false;
    session.bootstrapStarted = false;
    session.displaySeen = false;
    session.claiming = false;
    state.displayOwner = null;
    state.displayGeometry = null;
    state.displayViewers = 1;
    session.history = null;
    session.preboot.splice(0);
    session.prebootBytes = 0;
    session.ptyOffset = 0;
    session.writes.splice(0);
    session.writeBytes = 0;
    session.writeInFlight = false;

      message.total_bytes < 0 ||

      !Number.isSafeInteger(message.chunks) ||
      message.chunks !== Math.ceil(message.total_bytes / CHUNK_BYTES) ||

        message.pty_offset === undefined ||
        message.pty_offset === null ||
        (Number.isSafeInteger(message.pty_offset) && message.pty_offset >= 0)

    if (message.chunks === 0) finishReplay();
    return true;

  function acceptReplayChunk(frame) {
    const history = session.history;
    const metadata = history?.metadata;
    if (!history || !metadata || frame.kind !== 1 || frame.requestId !== history.requestId) return;
    const final = metadata.chunks - 1;
    const expected =
      frame.sequence === final ? metadata.total_bytes - final * CHUNK_BYTES : CHUNK_BYTES;
    if (
      frame.sequence >= metadata.chunks ||
      history.chunks.has(frame.sequence) ||
      frame.last !== (frame.sequence === final) ||
      frame.payload.byteLength !== expected ||
      history.bytes + frame.payload.byteLength > MAX_REPLAY_BYTES
    ) {
      api.error("replay_frame", "Malformed or duplicate replay chunk.", true);
      return;

    history.bytes += frame.payload.byteLength;

      typeof message.upload_capability !== "string" ||
      !Number.isSafeInteger(message.agent_generation) ||
      message.agent_generation <= 0 ||
      message.upload_max_bytes !== MAX_UPLOAD_BYTES ||
      message.upload_chunk_bytes !== CHUNK_BYTES
    ) {
      api.error("ctl_ready", "Daemon ready event has incompatible upload limits.");
      return;

    session.agentGeneration = message.agent_generation;
    api.sessionGate("daemonReady");

      type: "upload-progress",
      uploadId: upload.uploadId,
      totalBytes: upload.totalBytes,
      ...progress,
    });
  }

  function sendUploadStart(upload) {
    upload.startAttempts += 1;
    sendCtlText(upload.uploadId, "upload_start", {
      capability: session.uploadCapability,
      agent_generation: session.agentGeneration,
      name: upload.name,
      mime_type: upload.mimeType,
      destination: upload.destination,
      total_bytes: upload.totalBytes,
      chunks: upload.chunks,
      sha256: upload.sha256,
    });
    clearTimeout(upload.startTimer);
    upload.startTimer = setTimeout(() => {
      if (!session.uploads.has(upload.uploadId) || upload.finalDispatched) return;
      if (upload.startAttempts < UPLOAD_START_ATTEMPTS) {
        sendUploadStart(upload);
        return;
      }
      uploadProgress(upload, {
        state: "failed",
        sentBytes: upload.sentBytes,
        error: {
          code: "upload_start_timeout",
          message: "Upload start response timed out after three attempts.",
          retryable: true,
        },
      });
      session.uploads.delete(upload.uploadId);
    }, UPLOAD_START_TIMEOUT_MS);
  }

  function handleUploadResponse(message) {
    const upload = session.uploads.get(message.request_id);
    if (!upload) return false;
    clearTimeout(upload.startTimer);
    upload.startTimer = null;
    if (!message.ok) {
      uploadProgress(upload, {
        state: upload.finalDispatched ? "outcome_unknown" : "failed",
        sentBytes: upload.sentBytes,
        error: {
          code: message.error?.code ?? "upload_failed",
          message: message.error?.detail ?? "Upload failed.",
          retryable: false,
        },
      });
      if (!upload.finalDispatched) session.uploads.delete(upload.uploadId);
      return true;
    }
    if (message.operation === "upload_start" && message.state === "ready") {
      if (
        !Number.isSafeInteger(message.next_sequence) ||
        !Number.isSafeInteger(message.received_bytes)
      )
        return true;
      upload.nextSequence = message.next_sequence;
      upload.sentBytes = message.received_bytes;
      uploadProgress(upload, {
        state: "uploading",
        sentBytes: upload.sentBytes,
        nextSequence: upload.nextSequence,
      });
      return true;
    }
    if (
      message.operation === "upload_complete" &&
      message.state === "complete" &&
      message.total_bytes === upload.totalBytes &&
      message.sha256 === upload.sha256 &&
      typeof message.path === "string"
    ) {
      uploadProgress(upload, {
        state: "complete",
        sentBytes: upload.totalBytes,
        path: message.path,
        sha256: message.sha256,
      });
      session.uploads.delete(upload.uploadId);
      return true;
    }
    return false;

  function receiveCtlValue(value) {
    if (typeof value === "string") {
      if (new TextEncoder().encode(value).byteLength > 16 * 1024) return;

        message = JSON.parse(value);
      } catch {

      }

      else if (message.kind === "event" && message.event === "display_state") {

        if (!handleUploadResponse(message)) acceptReplayMetadata(message);

        if (frame) acceptReplayChunk(frame);
      }

      .then(() => receiveCtlValue(value))
      .catch((error) => api.error("ctl_decode", error.message, true));

    // refused, and acting as though it succeeded is what leaves the grid lying
    // about its width.
    if (state.displayOwner === false) return;

    session.claiming = true;
    state.displayOwner = true;
    state.displayGeometry = null;
    try {
      api.fitTerminal();
    } finally {
      session.claiming = false;

    return sendCtlText(crypto.randomUUID(), "take_control", {
      cols: state.cols,
      rows: state.rows,
    });
  };

    const owner = message.owner === true;
    const cols = Number.isSafeInteger(message.cols) ? message.cols : null;
    const rows = Number.isSafeInteger(message.rows) ? message.rows : null;

    state.displayGeometry = cols === null || rows === null ? null : { cols, rows };
    state.displayViewers = Number.isSafeInteger(message.viewers) ? message.viewers : 1;
    api.post({
      type: "display",
      owner,
      viewers: state.displayViewers,
      ...(cols === null ? {} : { cols }),
      ...(rows === null ? {} : { rows }),
    });

    // so the claim below still happens off the first frame that can carry it.
    if (!state.term) return;
    // Opening a terminal claims the display, matching the web client. Only off
    // the first frame, though: reacting to later ownership changes would have
    // two open viewers steal control from each other forever. A follower re-takes
    // it deliberately, from the banner.
    const first = !session.displaySeen;
    session.displaySeen = true;
    if (!owner && first) {
      api.takeDisplayControl();
      return;
    }
    api.fitTerminal();
  }

  function requestReplay() {
    if (!gates.ctlOpen || !gates.daemonReady || session.history) return;
    gates.historyReady = false;
    session.ready = false;
    const requestId = crypto.randomUUID();
    session.history = {
      requestId,
      operation: "snapshot",
      metadata: null,
      chunks: new Map(),
      bytes: 0,
      rendering: false,
    };
    sendCtlText(requestId, "snapshot", { lines: 10_000, plain: false });
  }

  api.requestReplay = requestReplay;

  function waitForBufferedAmount() {
    if (!state.ctl || state.ctl.bufferedAmount <= 256 * 1024) return Promise.resolve();
    state.ctl.bufferedAmountLowThreshold = 128 * 1024;
    return new Promise((resolve, reject) => {
      const timer = setTimeout(
        () => reject(new Error("Upload channel remained backpressured.")),
        5_000,
      );
      state.ctl.addEventListener(
        "bufferedamountlow",
        () => {
          clearTimeout(timer);
          resolve();
        },
        { once: true },
      );
    });
  }

  function validUploadStart(message) {
    if (
      typeof message.uploadId !== "string" ||
      typeof message.name !== "string" ||
      typeof message.mimeType !== "string" ||
      typeof message.sha256 !== "string"
    ) {
      return false;
    }
    const nameBytes = new TextEncoder().encode(message.name).byteLength;
    const mimeBytes = new TextEncoder().encode(message.mimeType).byteLength;
    return (
      uuidBytes(message.uploadId) !== null &&
      Number.isSafeInteger(message.totalBytes) &&
      message.totalBytes > 0 &&
      message.totalBytes <= MAX_UPLOAD_BYTES &&
      nameBytes >= 1 &&
      nameBytes <= 255 &&
      message.name !== "." &&
      message.name !== ".." &&
      !/[\u0000-\u001f\u007f-\u009f/\\]/.test(message.name) &&
      mimeBytes >= 1 &&
      mimeBytes <= 128 &&
      /^[\x21-\x7e]+$/.test(message.mimeType) &&
      !message.mimeType.includes(";") &&
      (message.destination === "cwd" ||
        (message.destination === "attachments" &&
          (message.mimeType.startsWith("image/") || message.mimeType === "application/json"))) &&
      /^[0-9a-f]{64}$/.test(message.sha256)
    );
  }

  api.handleUploadMessage = async (message) => {
    if (message.type === "upload-start") {
      if (
        !session.ready ||
        !session.uploadCapability ||
        !session.agentGeneration ||
        session.uploads.size >= 4 ||
        !validUploadStart(message)
      ) {
        api.post({
          type: "upload-progress",
          uploadId: message.uploadId,
          state: "failed",
          sentBytes: 0,
          totalBytes: message.totalBytes,
          error: {
            code: "upload_unavailable",
            message: "Session upload is unavailable.",
            retryable: true,
          },
        });
        return;
      }
      const chunks = Math.ceil(message.totalBytes / CHUNK_BYTES);
      const upload = {
        ...message,
        chunks,
        nextSequence: 0,
        sentBytes: 0,
        finalDispatched: false,
        startAttempts: 0,
        startTimer: null,
      };
      session.uploads.set(message.uploadId, upload);
      uploadProgress(upload, { state: "starting", sentBytes: 0 });
      sendUploadStart(upload);
      return;
    }
    const upload = session.uploads.get(message.uploadId);
    if (!upload) return;
    if (message.type === "upload-cancel") {
      if (!upload.finalDispatched) {
        sendCtlText(crypto.randomUUID(), "upload_cancel", {
          capability: session.uploadCapability,
          agent_generation: session.agentGeneration,
          upload_id: upload.uploadId,
        });
        uploadProgress(upload, { state: "cancelled", sentBytes: upload.sentBytes });
        clearTimeout(upload.startTimer);
        session.uploads.delete(upload.uploadId);
      }
      return;
    }
    if (message.sequence !== upload.nextSequence)
      throw new Error("Upload bridge sequence mismatch.");
    const payload = api.decodeBase64(message.data);
    const expected = message.last
      ? upload.totalBytes - message.sequence * CHUNK_BYTES
      : CHUNK_BYTES;
    if (
      payload.byteLength !== expected ||
      message.last !== (message.sequence === upload.chunks - 1)
    ) {
      throw new Error("Upload bridge chunk length or final flag mismatch.");
    }
    await waitForBufferedAmount();
    const frame = encodeUploadChunk(upload.uploadId, message.sequence, message.last, payload);
    if (!frame || !state.ctl || state.ctl.readyState !== "open")
      throw new Error("Upload channel closed.");
    if (message.last) {
      upload.finalDispatched = true;
      uploadProgress(upload, { state: "outcome_unknown", sentBytes: upload.sentBytes });
    }
    state.ctl.send(frame);
    upload.nextSequence += 1;
    upload.sentBytes += payload.byteLength;
    uploadProgress(upload, {
      state: message.last ? "outcome_unknown" : "uploading",
      sentBytes: upload.sentBytes,
      nextSequence: upload.nextSequence,
    });
  };
})();

(() => {
  "use strict";
  const api = globalThis.spawnWorker;
  const state = api.state;
  const host = { binding: false, channel: false, hello: false };
  const HOST_HELLO_BRIDGE_ID = "$host.hello";
  const HOST_STREAM_BRIDGE_PREFIX = "$host.stream:";
  const STREAM_COMMAND_PREFIX = "$host.stream.";
  const MAX_FRAME_BYTES = 16 * 1024;
  const MAX_CHUNK_BYTES = 8 * 1024;
  const BUFFERED_HIGH_WATER = 256 * 1024;
  const STREAM_TIMEOUT_MS = 60_000;

  function checkReady() {
    if (host.binding && host.channel && host.hello) api.post({ type: "state", state: "ready" });
  }

  function postResponse(requestId, ok, result, error) {
    api.post({
      type: "host-response",
      requestId,
      ok,
      ...(result === undefined ? {} : { result }),
      ...(error === undefined ? {} : { error }),
    });
  }

  function encodeFrame(frame) {
    const text = JSON.stringify(frame);
    if (new TextEncoder().encode(text).byteLength > MAX_FRAME_BYTES) {
      throw new Error("Host-control frame exceeds 16 KiB.");
    }
    return text;
  }

  function sendFrame(frame) {
    if (!state.ctl || state.ctl.readyState !== "open") {
      throw new Error("Host-control channel is not ready.");
    }
    state.ctl.send(encodeFrame(frame));
  }

  async function waitForWritable() {
    const deadline = Date.now() + STREAM_TIMEOUT_MS;
    while (state.ctl?.readyState === "open" && state.ctl.bufferedAmount > BUFFERED_HIGH_WATER) {
      if (Date.now() >= deadline) throw new Error("Host stream backpressure timed out.");
      await new Promise((resolve) => setTimeout(resolve, 10));
    }
    if (state.ctl?.readyState !== "open") throw new Error("Host-control channel is not ready.");
  }

  function streamFrame(type, payload) {
    if (!payload || typeof payload.stream_id !== "string" || payload.stream_id.length === 0) {
      throw new Error("Host stream command is missing its stream ID.");
    }
    if (type === "chunk") {
      if (!Number.isSafeInteger(payload.sequence) || payload.sequence < 0) {
        throw new Error("Host stream chunk sequence is invalid.");
      }
      if (typeof payload.bytes_b64 !== "string") {
        throw new Error("Host stream chunk bytes are invalid.");
      }
      const bytes = api.decodeBase64(payload.bytes_b64);
      if (bytes.byteLength === 0 || bytes.byteLength > MAX_CHUNK_BYTES) {
        throw new Error("Host stream chunk exceeds 8 KiB.");
      }
    } else if (type === "end") {
      if (
        !Number.isSafeInteger(payload.length) ||
        payload.length < 0 ||
        typeof payload.sha256 !== "string" ||
        !/^[0-9a-f]{64}$/.test(payload.sha256)
      ) {
        throw new Error("Host stream end frame is invalid.");
      }
    } else if (type === "ack") {
      if (!Number.isSafeInteger(payload.sequence) || payload.sequence < 1) {
        throw new Error("Host stream acknowledgement is invalid.");
      }
    }
    return {
      version: 1,
      type: `stream.${type}`,
      stream_id: payload.stream_id,
      ...(type === "chunk"
        ? { sequence: payload.sequence, bytes_b64: payload.bytes_b64 }
        : type === "end"
          ? { length: payload.length, sha256: payload.sha256 }
          : type === "ack"
            ? { sequence: payload.sequence }
            : {}),
    };
  }

  async function sendHostMessage(message) {
    try {
      if (message.type === "host-cancel") {
        sendFrame({ version: 1, type: "cancel", request_id: message.requestId });
        return;
      }
      if (message.type !== "host-request") return;
      if (message.operation.startsWith(STREAM_COMMAND_PREFIX)) {
        const type = message.operation.slice(STREAM_COMMAND_PREFIX.length);
        if (!["ack", "cancel", "chunk", "end"].includes(type)) {
          throw new Error("Unknown host stream command.");
        }
        if (type === "chunk" || type === "end") await waitForWritable();
        sendFrame(streamFrame(type, message.payload));
        postResponse(message.requestId, true, { sent: true });
        return;
      }
      sendFrame({
        version: 1,
        type: "request",
        request_id: message.requestId,
        operation: message.operation,
        ...(message.payload === undefined ? {} : { payload: message.payload }),
      });
    } catch (error) {
      postResponse(message.requestId, false, undefined, {
        code: "host_send_failed",
        detail: error instanceof Error ? error.message : "Host-control send failed.",
      });
    }
  }

  api.resetHostGeneration = () => {
    host.binding = false;
    host.channel = false;
    host.hello = false;
  };

  api.hostBindingAccepted = () => {
    host.binding = true;
    checkReady();
  };

  api.hostChannelOpened = () => {
    host.channel = true;
    checkReady();
  };

  api.receiveHostCtl = (value) => {
    if (typeof value !== "string") {
      api.error("host_binary", "Unexpected host-control binary frame.", false);
      return;
    }
    if (new TextEncoder().encode(value).byteLength > MAX_FRAME_BYTES) {
      api.error("host_frame_size", "Host-control frame exceeds 16 KiB.", false);
      return;
    }
    let message;
    try {
      message = JSON.parse(value);
    } catch {
      api.error("host_json", "Host-control frame is not valid JSON.", false);
      return;
    }
    if (message?.version !== 1) {
      api.error("host_version", "Host-control frame has an unsupported version.", false);
      return;
    }
    if (message.type === "hello" && message.protocol === "spawn.host.ctl") {
      postResponse(HOST_HELLO_BRIDGE_ID, true, message);
      host.hello = true;
      checkReady();
      return;
    }
    if (typeof message.type === "string" && message.type.startsWith("stream.")) {
      if (typeof message.stream_id !== "string") {
        api.error("host_stream", "Host stream frame is missing its stream ID.", false);
        return;
      }
      postResponse(`${HOST_STREAM_BRIDGE_PREFIX}${message.stream_id}`, true, message);
      return;
    }
    if (message.type !== "response" || typeof message.request_id !== "string") return;
    postResponse(message.request_id, message.ok === true, message.result, message.error);
  };

  api.handleHostMessage = (message) => {
    void sendHostMessage(message);
  };
})();

      : { scopeType: "host", protocol: "spawn.host.ctl", protocolVersion: 1 };
  }

   * channel works the way this file originally assumed. /ws/browser echoes the
   * browser-proposed `binding_nonce` and a server ownership `binding_generation`
   * on every frame. /ws/host mints its own nonce, never discloses it, and has no
   * generation at all: the scope tuple plus `session_id` is the whole binding.
   * Matching or gating on the session fields in host mode drops every daemon
   * frame and strands the connection in `connecting`. */
  function isSessionMode() {
    return state.mode === "session";
  }

  function outerTuple() {
    const tuple = protocolTuple();
    // `binding_nonce` is inert on /ws/host — the server substitutes its own
    // before the frame reaches the daemon — but it still guards teardown.
    return {
      session_id: state.rtcSessionId,
      binding_nonce: state.bindingNonce,
      ...(state.bindingGeneration === null ? {} : { binding_generation: state.bindingGeneration }),
      scope_type: tuple.scopeType,
      scope_id: state.scopeId,
      protocol: tuple.protocol,
      protocol_version: tuple.protocolVersion,
    };

    api.post({ type: "signal-frame", frame });
  }

    // only thing that tells the operator why, so it wins over the generic text.
    api.error("channel_closed", reason || `${label} closed before the session retired.`, true);
    api.post({ type: "state", state: "reconnecting" });

      signature: message.signature,
    };
    const offerFrame = {
      type: "rtc.offer",
      ...outerTuple(),
      signed_envelope: JSON.stringify(envelope),
    };
    if (Array.isArray(message.carriedEndorsements) && message.carriedEndorsements.length > 0) {
      offerFrame.carried_endorsements = message.carriedEndorsements;
    }
    emitSignal(offerFrame);
    if (!isSessionMode()) {
      state.offerSent = true;
      for (const candidate of state.pendingLocalCandidates.splice(0)) emitSignal(candidate);
    }
  }

  function frameMatches(value) {
    const tuple = protocolTuple();
    return (
      value?.session_id === state.rtcSessionId &&
      (!isSessionMode() || value?.binding_nonce === state.bindingNonce) &&
      value?.scope_type === tuple.scopeType &&
      value?.scope_id === state.scopeId &&
      value?.protocol === tuple.protocol &&
      value?.protocol_version === tuple.protocolVersion
    );
  }

  async function acceptSignal(frame) {
    if (frame?.type === "rtc.config") return;
    if (frame?.type === "rtc.status") {
      if (!frameMatches(frame)) return;
      if (
        isSessionMode() &&
        (frame.status === "negotiating" || frame.status === "connected") &&
        Number.isSafeInteger(frame.binding_generation) &&
        frame.binding_generation > 0
      ) {
        state.bindingGeneration = frame.binding_generation;
        api.sessionGate?.("bindingAccepted");
        for (const candidate of state.pendingLocalCandidates.splice(0)) {
          emitSignal({ ...candidate, binding_generation: frame.binding_generation });
        }
      }
      if (["failed", "unavailable", "collision", "disabled"].includes(frame.status)) {
        const reason = typeof frame.message === "string" ? frame.message.slice(0, 512) : "";
        channelFailed(`RTC ${frame.status}`, reason);
      }
      return;
    }
    if (!frameMatches(frame) || !state.pc) return;
    if (frame.type === "rtc.answer") {
      const envelope =
        typeof frame.signed_envelope === "string" ? JSON.parse(frame.signed_envelope) : null;
      if (
        !envelope ||
        envelope.sender_identity_public_key !== state.hostKey ||
        envelope.sdp.length === 0
      ) {
        throw new Error("Signed RTC answer identity or shape mismatch.");
      }
      await state.pc.setRemoteDescription({ type: "answer", sdp: envelope.sdp });
      // The host channel has no binding status to wait for: an answer signed by
      // the pinned host for this exact session and scope is the proof itself.
      if (!isSessionMode()) api.hostBindingAccepted?.();
      for (const candidate of state.pendingRemoteCandidates.splice(0))
        await state.pc.addIceCandidate(candidate);
      return;
    }
    if (frame.type === "rtc.candidate" && frame.candidate) {
      if (!state.pc.remoteDescription) state.pendingRemoteCandidates.push(frame.candidate);
      else await state.pc.addIceCandidate(frame.candidate);
    }
  }

  function teardown(sendClose) {
    if (sendClose && state.rtcSessionId && state.bindingNonce) {
      emitSignal({ type: "rtc.close", ...outerTuple() });
    }
    clearTimeout(state.disconnectTimer);
    state.disconnectTimer = null;
    for (const channel of [state.pty, state.ctl]) {
      if (!channel) continue;
      channel.onclose = null;
      channel.onerror = null;
      channel.close();
    }
    state.pty = null;
    state.ctl = null;
    state.pc?.close();
    state.pc = null;
    state.offerSent = false;
    state.pendingLocalCandidates.splice(0);
    state.pendingRemoteCandidates.splice(0);
    state.pendingSign.clear();
  }

  api.handleTransportMessage = async (message) => {
    switch (message.type) {
      case "connect":
        await startPeer(message);
        break;
      case "sign-response":
        await acceptSignResponse(message);
        break;
      case "signal-frame":
        await acceptSignal(message.frame);
        break;
      case "request-replay":
        api.requestReplay?.(message.fromOffset);
        break;
      case "upload-start":
      case "upload-chunk":
      case "upload-cancel":
        await api.handleUploadMessage?.(message);
        break;
      case "host-request":
      case "host-cancel":
        api.handleHostMessage?.(message);
        break;
      case "close":
        state.stopped = true;
        teardown(true);
        api.post({ type: "state", state: "closed" });
        break;
      default:
        api.error("bridge_message", `Unknown worker command: ${String(message.type)}.`);
    }
  };
})();
</script></body>

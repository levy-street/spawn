<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPAWN D Tab Groups — mock</title>
<style>
  :root {
    --background: oklch(0.10 0 0); --foreground: oklch(0.97 0 0);
    --muted-foreground: oklch(0.71 0 0); --card: oklch(0.16 0 0);
    --shell: oklch(0.2 0 0); --input: oklch(0.27 0 0); --ring: oklch(0.97 0 0);
    --popover: oklch(0.25 0 0); --popover-foreground: oklch(0.97 0 0);
    --popover-border: oklch(0.32 0 0); --popover-accent: rgba(242,237,226,0.1);
    --primary: oklch(0.97 0 0); --primary-foreground: oklch(0.10 0 0);
    --destructive: oklch(0.63 0.2 25); --warning: oklch(0.78 0.15 75);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--shell); color: var(--foreground); font: 14px/1.4 ui-sans-serif, system-ui, sans-serif; }
  .shell { display: flex; height: 100vh; }
  .side { width: 200px; padding: 12px; display: flex; flex-direction: column; gap: 4px; }
  .brand { font-weight: 700; letter-spacing: .08em; font-size: 12px; margin-bottom: 8px; color: var(--muted-foreground); }
  .ws { all: unset; padding: 6px 8px; border-radius: 6px; cursor: pointer; color: var(--muted-foreground); font-size: 13px; }
  .ws.on, .ws:hover { background: rgba(255,255,255,.06); color: var(--foreground); }
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .strip { display: flex; height: 44px; flex-shrink: 0; align-items: flex-end; gap: 4px; overflow-x: auto; padding: 0 6px 6px 0; scrollbar-width: none; }
  .relative { position: relative; } .shrink-0 { flex-shrink: 0; }
  .tab { display: flex; height: 32px; min-width: 96px; max-width: 224px; align-items: center; gap: 6px; border-radius: 6px; padding: 0 26px 0 12px; font: 500 12px/1 inherit; color: var(--muted-foreground); background: none; border: 0; cursor: pointer; }
  .tab:hover { background: rgba(255,255,255,.05); color: var(--foreground); }
  .tab.active { background: var(--card); color: var(--foreground); height: 38px; margin-bottom: -6px; padding-bottom: 6px; border-radius: 6px 6px 0 0; }
  .tab input { background: none; border: 0; border-bottom: 1px solid rgba(255,255,255,.3); color: inherit; font: inherit; width: 90px; outline: none; }
  .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge { display: inline-flex; height: 18px; min-width: 18px; align-items: center; justify-content: center; border-radius: 9px; font: 600 10px ui-monospace, monospace; background: color-mix(in oklab, var(--warning) 15%, transparent); color: var(--warning); }
  .x { position: absolute; right: 6px; top: 16px; transform: translateY(-50%); width: 18px; height: 18px; border: 0; border-radius: 4px; background: none; color: var(--muted-foreground); cursor: pointer; opacity: 0; }
  .wrap:hover .x, .tab.active + .x { opacity: 1; }
  .x:hover { background: rgba(255,255,255,.1); color: var(--foreground); }
  .newwrap { position: relative; margin-bottom: 2px; }
  .plus { width: 28px; height: 28px; border: 0; border-radius: 6px; background: none; color: var(--muted-foreground); font-size: 18px; cursor: pointer; }
  .plus:hover { color: var(--foreground); background: rgba(255,255,255,.06); }
  .panel { flex: 1; margin: 0 6px 6px 0; background: var(--card); border-radius: 0 8px 8px 8px; padding: 0; overflow: hidden; }
  .pane { height: 100%; display: flex; flex-direction: column; }
  .pane-head { padding: 8px 12px; font-size: 12px; color: var(--muted-foreground); border-bottom: 1px solid rgba(255,255,255,.06); }
  .term { margin: 0; padding: 12px; font: 13px/1.5 ui-monospace, monospace; color: #cfc8b8; }
  .menu { z-index: 100; min-width: 176px; border-radius: 8px; border: 1px solid var(--popover-border); background: var(--popover); color: var(--popover-foreground); padding: 4px; box-shadow: 0 20px 25px rgba(0,0,0,.5); }
  .newmenu { position: absolute; top: 32px; left: 0; }
  .item { display: flex; width: 100%; align-items: center; gap: 8px; border: 0; border-radius: 6px; background: none; color: inherit; padding: 8px; text-align: left; font: 14px inherit; cursor: pointer; }
  .item:hover, .item:focus-visible { background: var(--popover-accent); outline: none; }
  .item.destructive { color: var(--destructive); }
  .ic { width: 16px; height: 16px; }
  .sep { margin: 4px; height: 1px; border: 0; background: var(--popover-border); }
</style>
</head>
<body>
<div id="root"></div>
<script src="mock.bundle.js"></script>
<script src="../content.js"></script>
</body>
</html>

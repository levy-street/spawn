[project]
name = "spawn-server"
version = "0.1.0"
description = "Control plane server for spawn — multi-tenant CLI agent orchestrator."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
    "redis>=5.2",
    "python-multipart>=0.0.20",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "cryptography>=44.0",
    "http-ece>=1.2",
    # The only dependency here that is not already a transitive one, and the
    # only one that ships a second HTTP client into a server standardised on
    # `httpx`. `web_push.py:29-32` records rejecting a library for exactly
    # that; this one earns its place by owning webhook signature verification,
    # API versioning and retry semantics against a payment processor, which we
    # would otherwise reimplement badly. It is confined to
    # `spawn_server/billing_stripe.py`, the only module allowed to import it.
    "stripe>=15,<16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spawn_server"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

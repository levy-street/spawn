name: release

# What a push to master owes, done in the order docs/RELEASE.md forces.
#
# This workflow decides nothing on its own: `scripts/release-plan.sh` compares
# subtree hashes between the deployed commit and this one and reports which
# pieces changed, and every job below is gated on that answer. Most pushes owe
# one or two rows; a push that changes only docs owes none and this finishes in
# seconds.
#
# The order is not a preference. The daemon prebuilts must be published before
# or with the server that advertises them, because a daemon refused at the
# handshake heals itself from the manifest that server serves — publish the
# server first and every daemon in the field spends its retry loop fetching a
# build that is refused just the same. The mobile OTA goes last for the mirror
# reason: the server must already be up, so no phone fetches JavaScript newer
# than the API it talks to.
"on":
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      from:
        description: "Optional assertion of the public deployed baseline (must match /api/release)"
        required: false

# A half-finished release is worse than a queued one, so releases never cancel
# each other and never overlap.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  acceptance:
    name: validate native connections and isolated canaries
    needs: plan
    if: >-
      needs.plan.outputs.deploy == 'true' ||
      needs.plan.outputs.daemon_prebuilts == 'true' ||
      needs.plan.outputs.mobile_ota == 'true' ||
      needs.plan.outputs.mobile_native_build == 'yes' ||
      needs.plan.outputs.desktop_publish == 'true'
    uses: ./.github/workflows/acceptance.yml
    with:
      candidate: ${{ github.sha }}
      baseline: ${{ needs.plan.outputs.baseline }}

  await_source_ci:
    name: require exact master push test results
    needs: acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 185
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Wait for Linux and required Windows validation
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ github.sha }}
          REQUIRE_WINDOWS: ${{ needs.acceptance.outputs.require_windows }}
        run: |
          set -euo pipefail
          args=(--wait-ci "$GITHUB_REPOSITORY" --candidate "$CANDIDATE" --timeout 10800)
          if [[ "$REQUIRE_WINDOWS" == true ]]; then args+=(--require-windows); fi
          python3 scripts/check-release-acceptance.py "${args[@]}"

  plan:
    name: what does this owe
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/master'
    # EXPO_TOKEN is an environment secret, and the fingerprint check needs it;
    # without an environment the mobile row would silently read "unknown" and
    # a release that owed a store build would quietly not do one. The policy
    # permits only master, which is also what this workflow runs on.
    environment: production
    outputs:
      baseline: ${{ steps.baseline.outputs.commit }}
      deploy: ${{ steps.plan.outputs.deploy }}
      daemon_prebuilts: ${{ steps.plan.outputs.daemon_prebuilts }}
      mobile_ota: ${{ steps.plan.outputs.mobile_ota }}
      mobile_native_build: ${{ steps.plan.outputs.mobile_native_build }}
      mobile_native_ios: ${{ steps.plan.outputs.mobile_native_ios }}
      mobile_native_android: ${{ steps.plan.outputs.mobile_native_android }}
      mobile_native_reason: ${{ steps.plan.outputs.mobile_native_reason }}
      mobile_runtime: ${{ steps.plan.outputs.mobile_runtime }}
      mobile_native_ios_runtime: ${{ steps.plan.outputs.mobile_native_ios_runtime }}
      mobile_native_android_runtime: ${{ steps.plan.outputs.mobile_native_android_runtime }}
      desktop_publish: ${{ steps.plan.outputs.desktop_publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          # release-plan.sh compares two commits' subtrees, so it needs both.
          fetch-depth: 0

      - name: Resolve the current public production baseline
        id: baseline
        run: |
          baseline="$(python3 scripts/check-release-acceptance.py --resolve-baseline)"
          printf 'commit=%s\n' "$baseline" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Work out what changed
        id: plan
        env:
          # The fingerprint comparison asks EAS what native shell the last
          # production build of each platform had. Without it the mobile row
          # is "unknown", and phones get nothing until a person looks.
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          FROM: ${{ github.event.inputs.from }}
          BASELINE: ${{ steps.baseline.outputs.commit }}
          CANDIDATE: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ -z "${FROM:-}" || "$FROM" == "$BASELINE" ]] || { echo '::error::from must match the validated public baseline'; exit 1; }
          args=(--json --from "$BASELINE" --to "$CANDIDATE")
          [ -n "${EXPO_TOKEN:-}" ] || args+=(--no-fingerprint)
          scripts/release-plan.sh "${args[@]}" | tee /tmp/plan.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          plan = json.load(open("/tmp/plan.json"))
          for key in ("deploy", "daemon_prebuilts", "mobile_ota", "desktop_publish"):
              print(f"{key}={str(plan[key]).lower()}")
          for key in ("mobile_native_build", "mobile_native_ios", "mobile_native_android",
                      "mobile_native_reason", "mobile_runtime", "mobile_native_ios_runtime",
                      "mobile_native_android_runtime"):
              print(f"{key}={' '.join(str(plan[key]).split())}")
          PY

      - name: Say it out loud
        run: |
          {
            echo "### Release plan"
            echo '```json'
            cat /tmp/plan.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The daemon binaries themselves are built and published by prebuilt.yml,
  # which fires on the same push. This job waits for that rolling release to
  # describe *this* commit before the deploy is allowed to consume it.
  await_prebuilts:
    name: wait for prebuilt-latest
    needs: plan
    if: needs.plan.outputs.daemon_prebuilts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
      - name: Wait for the rolling release to describe this daemon tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          want="$(git rev-parse HEAD:daemon)"
          for _ in $(seq 1 60); do
            got="$(gh release download prebuilt-latest --repo "$GITHUB_REPOSITORY" \
                     --pattern TREE --output - 2>/dev/null || true)"
            if [ "$got" = "$want" ]; then
              echo "prebuilt-latest describes $want"; exit 0
            fi
            echo "prebuilt-latest is at '${got:-none}', waiting for $want"
            sleep 60
          done
          echo "::error::prebuilt-latest never described $want; the deploy would be refused anyway" >&2
          exit 1

  deploy:
    name: server, web, daemon manifest and the phone
    needs: [plan, await_prebuilts, acceptance, await_source_ci]
    # A daemon-only change still deploys, because that is what publishes the
    # signed manifest. always() keeps this reachable when await-prebuilts was
    # skipped for a release that owes no prebuilts.
    if: >-
      always() &&
      needs.plan.result == 'success' &&
      needs.acceptance.result == 'success' &&
      needs.await_source_ci.result == 'success' &&
      needs.await_prebuilts.result != 'failure' &&
      needs.await_prebuilts.result != 'cancelled' &&
      (needs.plan.outputs.deploy == 'true' ||
       needs.plan.outputs.daemon_prebuilts == 'true' ||
       needs.plan.outputs.mobile_ota == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Select the validated commit on the local master branch
        env:
          CANDIDATE: ${{ github.sha }}
        run: git checkout -B master "$CANDIDATE"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-acceptance
          path: ${{ runner.temp }}/release-acceptance

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # The manifest is signed through the server project's pinned crypto, and
      # the OTA proves its bake with `npx expo config` — so both toolchains
      # have to be here, not just ssh.
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Authorise SSH to the production host
        env:
          DEPLOY_KEY: ${{ secrets.SPAWN_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.SPAWN_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [ -n "${DEPLOY_KEY:-}" ] || { echo "::error::SPAWN_DEPLOY_SSH_KEY is not set" >&2; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pinned, never scanned: TOFU against a host that deploys production
          # is the one place a first connection must not be trusted blindly.
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          # Keepalives are load-bearing: the runner's NAT drops a connection
          # that goes quiet, and a deploy has minutes-long silent phases. The
          # first release hung for forty minutes on exactly this.
          printf 'Host spawnd-prod\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/id_ed25519\n  ServerAliveInterval 15\n  ServerAliveCountMax 8\n' \
            "${{ vars.SPAWN_DEPLOY_HOSTNAME }}" "${{ vars.SPAWN_DEPLOY_USER }}" > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Provide the offline daemon release-signing key
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.SPAWN_RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          # deploy-prod.sh refuses to publish prebuilts without this, and that
          # refusal is correct: an unsigned manifest is not a release. See the
          # note in docs/RELEASE.md about what putting this key here costs.
          [ -n "${RELEASE_SIGNING_KEY:-}" ] || { echo "::error::SPAWN_RELEASE_SIGNING_KEY is not set" >&2; exit 1; }
          install -d -m 700 ~/.config/spawn
          printf '%s\n' "$RELEASE_SIGNING_KEY" > ~/.config/spawn/release-signing.key
          chmod 600 ~/.config/spawn/release-signing.key

      - name: Deploy server, web, the signed daemon manifest and the OTA
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          # release-lib.sh pulls prebuilt-latest with gh, which needs a token
          # on a runner (and this repository is private).
          GH_TOKEN: ${{ github.token }}
          # Inherited values are refused by the script, so name it explicitly.
          SPAWN_DEPLOY_MOBILE_CHANNEL: production
          # The OTA goes out only when the plan proved this tree still fits the
          # native shell of the last production build on both platforms.
          # "yes" and "unknown" withhold it: it would reach every phone on the
          # channel, including shells that cannot run it. The deploy prints
          # the publish command instead, and the job below stops the release.
          SPAWN_DEPLOY_MOBILE: ${{ needs.plan.outputs.mobile_native_build == 'no' && '1' || '0' }}
        run: |
          set -euo pipefail
          scripts/deploy-prod.sh spawnd-prod --api-proxy-target http://127.0.0.1:8001 \
            --resume \
            --acceptance-evidence "$RUNNER_TEMP/release-acceptance/acceptance.json"

  # A push never starts a store build. Each one costs EAS credit and half an
  # hour, and the only time one is owed is when the native fingerprint of this
  # tree differs from the last production build of that platform; even then a
  # person starts it, through mobile-store-recovery.yml. This job is the stop:
  # whenever the phone update was withheld (a native change, or a check that
  # could not answer), the release fails here and says what to do. Server, web
  # and daemon never wait on it.
  store-build-owed:
    name: require the owed store builds
    needs: [plan, deploy]
    # !cancelled(), not success(): it must report when the deploy failed or an
    # optional ancestor was skipped.
    if: >-
      !cancelled() &&
      needs.plan.result == 'success' &&
      needs.plan.outputs.mobile_ota == 'true' &&
      needs.plan.outputs.mobile_native_build != 'no'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Stop the release; phones were not updated
        env:
          VERDICT: ${{ needs.plan.outputs.mobile_native_build }}
          IOS: ${{ needs.plan.outputs.mobile_native_ios }}
          ANDROID: ${{ needs.plan.outputs.mobile_native_android }}
          REASON: ${{ needs.plan.outputs.mobile_native_reason }}
          RUNTIME: ${{ needs.plan.outputs.mobile_runtime }}
          IOS_RUNTIME: ${{ needs.plan.outputs.mobile_native_ios_runtime }}
          ANDROID_RUNTIME: ${{ needs.plan.outputs.mobile_native_android_runtime }}
          BASELINE: ${{ needs.plan.outputs.baseline }}
          CANDIDATE: ${{ github.sha }}
          RELEASE_RUN: ${{ github.run_id }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          set -euo pipefail
          owed=()
          [[ "$IOS" != yes ]] || owed+=(ios)
          [[ "$ANDROID" != yes ]] || owed+=(android)
          # Does a build from this run keep the runtime the installed apps have?
          # Then the next JavaScript-only release reaches them all.
          # The strongest finding wins: same, then unsure, then new.
          same=0; unsure=0; [[ ${#owed[@]} -gt 0 ]] || unsure=1
          for platform in "${owed[@]}"; do
            shell="$IOS_RUNTIME"; [[ "$platform" == ios ]] || shell="$ANDROID_RUNTIME"
            if [[ -z "$RUNTIME" || "$RUNTIME" == unknown || -z "$shell" || "$shell" == unknown ]]; then
              unsure=1
            elif [[ "$shell" == "$RUNTIME" ]]; then
              same=1
            fi
          done
          runtime_check=new
          [[ "$unsure" == 0 ]] || runtime_check=unsure
          [[ "$same" == 0 ]] || runtime_check=same
          {
            if [[ "$VERDICT" == yes ]]; then
              echo "### Phones were not updated: a store build is owed (${owed[*]:-see the plan})"
              echo
              echo "The native fingerprint of this commit no longer matches the last production"
              echo "build for: **${owed[*]:-see the plan}**. ios: ${IOS:-?}, android: ${ANDROID:-?}."
              echo "Why: ${REASON:-not recorded}"
              echo
              echo "Deploy job: **$DEPLOY_RESULT**. It published no over-the-air update,"
              echo "because one would reach phones whose native shell cannot run it. A release"
              echo "never starts a store build."
              echo
              echo "#### Before building: the runtime version"
              echo
              echo "This commit's updates carry runtime \`${RUNTIME:-unknown}\`. The last iOS build has"
              echo "\`${IOS_RUNTIME:-unknown}\`, the last Android build \`${ANDROID_RUNTIME:-unknown}\`."
              case "$runtime_check" in
                same)
                  echo
                  echo "**A build from this run keeps runtime \`$RUNTIME\`.** Store builds reach TestFlight"
                  echo "and Play internal testing, not the public. The next release that changes"
                  echo "only JavaScript will match that new build and publish an over-the-air update"
                  echo "to every installed app on \`$RUNTIME\`, including the public ones without this"
                  echo "native change. **If the new JavaScript cannot run on the app people already"
                  echo "have, do not build from this run:** bump \`expo.version\` in \`mobile/app.json\`"
                  echo "first, and build from the release of that commit."
                  ;;
                new)
                  echo
                  echo "The runtime differs, so installed apps on the old runtime will not receive"
                  echo "updates published for this one; they keep their JavaScript until they"
                  echo "install the new build."
                  ;;
                *)
                  echo
                  echo "The runtimes could not be compared. Before building, check \`expo.version\`"
                  echo "in \`mobile/app.json\` against the apps people have installed: on an unchanged"
                  echo "runtime, the next JavaScript-only release reaches all of them."
                  ;;
              esac
              echo
              echo "#### Building deliberately"
              echo
              echo "If this native change is meant to ship on that runtime, once the deploy job"
              echo "here has succeeded, start a build for each platform named above and no"
              echo "other. Run these **one at a time**, each after the previous run has finished"
              echo "and while no release run is queued: they share the \`release\` concurrency"
              echo "group, and a newly queued run cancels any run already waiting in it,"
              echo "including a pending master release."
              echo
              echo '```'
              echo "gh workflow run mobile-store-recovery.yml --ref master -f release_run=$RELEASE_RUN -f operation=inspect"
              for platform in "${owed[@]}"; do
                echo "gh workflow run mobile-store-recovery.yml --ref master -f release_run=$RELEASE_RUN -f operation=build-$platform"
              done
              echo '```'
              echo
              echo "A platform left unbuilt stays at yes and stops every later release that"
              echo "changes \`mobile/\`. Then run inspect until the builds and their submissions"
              echo "finish. See \"Recover native store builds after deployment\" in docs/RELEASE.md."
            else
              echo "### Phones were not updated: the native shell check did not answer"
              echo
              echo "ios: ${IOS:-?}, android: ${ANDROID:-?}. Why: ${REASON:-not recorded}"
              echo
              echo "Deploy job: **$DEPLOY_RESULT**; server, web and daemon do not wait on this"
              echo "check. Nothing was published to phones, because nothing proved this tree"
              echo "still fits the shell they run, and no store build was started. Ask again for"
              echo "exactly this commit, where Expo is signed in, in a clean clone or worktree"
              echo "(\`-B\` moves its local master to this commit, as the deploy job does)."
              echo "\`npm ci\` matters: the fingerprint finds native modules through"
              echo "\`mobile/node_modules\`, so a stale install can miss a new native dependency."
              echo
              echo '```'
              echo "git fetch origin && git checkout -B master $CANDIDATE"
              echo "(cd mobile && npm ci)"
              echo "scripts/release-plan.sh --from $BASELINE --to $CANDIDATE"
              echo '```'
              echo
              echo "If its mobile store build is **no**, publish from that same checkout, which"
              echo "publishes exactly this commit's tree even when origin/master has moved on:"
              echo "\`scripts/update-mobile-prod.sh -m \"<summary>\"\`. Never publish from another"
              echo "master, stale or newer. If it is **yes**, publish nothing for this tree: a"
              echo "store build is owed for the platforms it names; read \"The phone\" in"
              echo "docs/RELEASE.md, runtime warning first."
            fi
            echo
            echo "Do not use **Re-run all jobs** on this release: it plans again from production,"
            echo "where this commit is already deployed, turns the run green and leaves nothing"
            echo "for store recovery to bind to. **Re-run failed jobs** is fine. Until an update"
            echo "for this tree is published, \`scripts/verify-release.sh\` reports \`mobile.tree\`"
            echo "as not matching; that is expected, and a store build alone does not change it."
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "::error title=Phones were not updated::mobile_native_build=$VERDICT (ios=${IOS:-?}, android=${ANDROID:-?}, runtime=${RUNTIME:-?}); no OTA was published and no store build was started. See this job's summary for the manual step."
          exit 1

  # desktop.yml builds and signs the app on the same push. Promoting those
  # artifacts needs the offline Tauri updater key, which signs latest.json.
  desktop-publish:
    name: publish the desktop app
    needs: [plan, deploy]
    if: >-
      !cancelled() &&
      needs.plan.result == 'success' &&
      needs.deploy.result == 'success' &&
      needs.plan.outputs.desktop_publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
      - name: Not yet wired
        run: |
          echo "::warning::desktop publication is not automated yet."
          {
            echo "### Desktop still needs a person"
            echo
            echo "\`desktop/\` changed, so this release owes a desktop publish."
            echo "Download the signed artifacts from the \`Desktop artifacts\` run"
            echo "for this commit, sign the payloads with the offline Tauri"
            echo "updater key, assemble \`latest.json\`, then:"
            echo
            echo '```'
            echo "scripts/publish-desktop.sh spawnd-prod <artifact-dir>"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

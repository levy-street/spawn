name: test

"on":
  workflow_dispatch:
    inputs:
      arm64_only:
        description: Build and execute ARM64 binaries on a native hosted runner; no publication
        type: boolean
        default: false
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}-${{ inputs.arm64_only }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name != 'workflow_dispatch' || inputs.arm64_only != true
    runs-on: ubuntu-24.04
    # The matrix outgrew 30 minutes when the mesh and workspaces work grew the
    # suites (server pytest ~8m, daemon tests, ten smokes, 220+ Playwright
    # specs, production build); 30 was cancelling runs mid-e2e.
    timeout-minutes: 150
    env:
      CI: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      # Leave CPU and memory for the Next dev server on the hosted runner.
      SPAWN_E2E_WORKERS: "2"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install host packages
        run: |
          sudo apt-get update
          # ripgrep: the source guards (e.g. check-worker-only-daemon.sh) shell
          # out to `rg`; without it their self-tests fail and test-all.sh exits 1.
          sudo apt-get install -y redis-server postgresql-16 ripgrep qemu-system-x86 qemu-utils cloud-image-utils ubuntu-cloudimage-keyring

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            daemon/target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('daemon/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          cache-dependency-glob: server/uv.lock
          # The post-job "Pruning cache" step can fail on runner teardown
          # (uv exit 2 five minutes after "all repeatable checks passed")
          # and paint a fully green matrix red. Skip it; the cache key
          # already rotates on uv.lock changes.
          prune-cache: false

      - name: Install server dependencies
        working-directory: server
        run: |
          uv python install 3.13
          uv sync --frozen

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Chromium
        working-directory: web
        run: bunx playwright install --with-deps chromium

      - name: Verify systemd user restart in a disposable VM
        timeout-minutes: 20
        run: python3 scripts/ci/smoke-systemd-vm.py
      - name: Run repeatable test matrix
        run: bash scripts/ci/with-test-databases.sh scripts/test-all.sh
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-browser-test-results
          path: web/test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Preserve systemd VM evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-systemd-smoke
          path: ${{ runner.temp }}/spawnd-systemd-smoke-serial.log
          if-no-files-found: ignore
          retention-days: 14

  linux-arm64:
    if: github.event_name == 'workflow_dispatch' && inputs.arm64_only == true
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CARGO_BUILD_JOBS: "3"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - name: Build and execute native ARM64 binaries
        working-directory: daemon
        run: |
          test "$(uname -m)" = aarch64
          cargo build --release --locked --bin spawnd --bin spawn-worker
          target/release/spawnd --version
          target/release/spawn-worker --version
          mkdir -p ../out
          cp target/release/spawnd ../out/spawnd-aarch64-unknown-linux-gnu
          cp target/release/spawn-worker ../out/spawn-worker-aarch64-unknown-linux-gnu
      - name: Retain ARM64 validation artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-arm64-validation
          path: out/
          if-no-files-found: error
          retention-days: 14

name: test

"on":
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # The matrix outgrew 30 minutes when the mesh and workspaces work grew the
    # suites (server pytest ~8m, daemon tests, ten smokes, 220+ Playwright
    # specs, production build); 30 was cancelling runs mid-e2e.
    timeout-minutes: 60
    env:
      CI: "1"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install host packages
        run: |
          sudo apt-get update
          # ripgrep: the source guards (e.g. check-worker-only-daemon.sh) shell
          # out to `rg`; without it their self-tests fail and test-all.sh exits 1.
          sudo apt-get install -y redis-server ripgrep

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            daemon/target
          key: cargo-${{ runner.os }}-${{ hashFiles('daemon/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: server/uv.lock
          # The post-job "Pruning cache" step can fail on runner teardown
          # (uv exit 2 five minutes after "all repeatable checks passed")
          # and paint a fully green matrix red. Skip it; the cache key
          # already rotates on uv.lock changes.
          prune-cache: false

      - name: Install server dependencies
        working-directory: server
        run: |
          uv python install 3.13
          uv sync --frozen

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Chromium
        working-directory: web
        run: bunx playwright install --with-deps chromium

      - name: Run repeatable test matrix
        run: scripts/test-all.sh

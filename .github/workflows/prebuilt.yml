name: prebuilt

# Build + test the daemon on real macOS, Linux, and Windows runners and publish
# every supported target as a single rolling prerelease that deploy-prod.sh
# pulls onto the server. Windows PEs are Authenticode-signed with the protected
# Dreamhome AI Key Vault certificate. One workflow owns the rolling
# `prebuilt-latest` release: the per-platform build jobs upload artifacts and a
# single publish job assembles them, so the jobs never race to delete+recreate
# the same release. Gated to daemon changes so it rarely spends macOS/arm minutes
# on our own machines. Pool setup and isolation are in docs/CI_RUNNERS.md.
"on":
  push:
    branches:
      - master
    paths:
      - "daemon/**"
      - ".github/workflows/prebuilt.yml"
  workflow_dispatch:

concurrency:
  group: prebuilt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: [self-hosted, macOS, ARM64, "${{ github.ref == 'refs/heads/master' && 'spawn-macos-release' || 'spawn-macos-build' }}"]
    timeout-minutes: 40
    # The Apple Developer ID lives in the `macos-code-signing` environment,
    # whose deployment branch policy permits only `master`. Off master the job
    # runs in `unsigned-builds`, which holds no secrets — so a pushed branch
    # plus `gh workflow run --ref` cannot load the exportable .p12 into a
    # runner, and the signing step below falls back to ad-hoc. Both
    # environments must exist; see docs/AZURE_SIGNING_SETUP.md.
    environment: ${{ github.ref == 'refs/heads/master' && 'macos-code-signing' || 'unsigned-builds' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust (stable + x86_64 target)
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: x86_64-apple-darwin

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            daemon/target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('daemon/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-

      # Runs the full daemon suite on real macOS — this is what catches
      # macOS-only regressions like the sun_path socket bug before they ship.
      # Non-blocking for now: the worker integration tests set a long temp
      # SPAWND_WORKER_DIR that itself overflows sun_path on macOS, so this is
      # expected red until those tests are hardened (tracked follow-up). Kept
      # visible so we get the signal; flip to a hard gate once green.
      - name: Test on macOS
        working-directory: daemon
        continue-on-error: true
        # Bounded for the same reason it is non-blocking: this step is signal,
        # not a gate, and a wedged test must not starve the build steps of the
        # job's 40-minute budget (observed: an upload test hung ~37 minutes on
        # the runner and the release never built).
        timeout-minutes: 10
        run: cargo test --locked

      - name: Build arm64 (aarch64-apple-darwin)
        working-directory: daemon
        run: cargo build --release --locked --bin spawnd --bin spawn-worker

      - name: Build x86_64 (cross)
        working-directory: daemon
        run: cargo build --release --locked --target x86_64-apple-darwin --bin spawnd --bin spawn-worker

      # A Mach-O the linker signed by itself seals nothing it did not write:
      # `codesign -dv` on such a binary says `Info.plist=not bound`, so the
      # usage strings daemon/Info.plist embeds are ignored and every macOS
      # consent dialog on the user's machine is headed by a per-build hash
      # (`spawnd-fc29710558bd7071`) with no product name and no sentence. One
      # re-sign binds them and adopts `dev.spawnd.daemon` as the identifier.
      #
      # Ad-hoc by default because it cannot fail and needs no secret. Setting
      # the repository variable SIGN_DAEMON_WITH_DEVELOPER_ID to `true` uses the
      # Developer ID certificate desktop.yml already holds, which is the only
      # way a consent grant survives a daemon self-update: TCC keys the grant on
      # the signing identity, and an ad-hoc identity is the binary's own hash,
      # so it changes with every release and every folder is asked for again.
      # Read "The macOS consent dialogs" in docs/RELEASE.md before turning it on
      # — it changes what every existing host is asked, once.
      - name: Sign the darwin binaries
        env:
          DEVELOPER_ID: ${{ vars.SIGN_DAEMON_WITH_DEVELOPER_ID }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -eu
          identity="-"
          # Belt and braces with the environment scoping on the job: the
          # Developer ID is a release identity and only master cuts releases.
          if [ "${GITHUB_REF:-}" != "refs/heads/master" ] && [ -n "${APPLE_CERTIFICATE:-}" ]; then
            echo "Refusing the Developer ID off master; signing ad-hoc." >&2
            APPLE_CERTIFICATE=""
          fi
          if [ "${DEVELOPER_ID:-}" = "true" ] && [ -n "${APPLE_CERTIFICATE:-}" ]; then
            keychain="$RUNNER_TEMP/spawnd-signing.keychain-db"
            python3 scripts/ci/macos-keychain.py save
            cleanup_signing() {
              result=$?
              python3 scripts/ci/macos-keychain.py restore || result=1
              rm -f "$RUNNER_TEMP/daemon-cert.p12" || result=1
              exit "$result"
            }
            trap cleanup_signing EXIT
            password="$(uuidgen)"
            security create-keychain -p "$password" "$keychain"
            security set-keychain-settings -lut 900 "$keychain"
            security unlock-keychain -p "$password" "$keychain"
            printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/daemon-cert.p12"
            security import "$RUNNER_TEMP/daemon-cert.p12" -k "$keychain" \
              -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple:,codesign: \
              -s -k "$password" "$keychain" >/dev/null
            security list-keychain -d user -s "$keychain" login.keychain-db
            rm -f "$RUNNER_TEMP/daemon-cert.p12"
            identity="$APPLE_SIGNING_IDENTITY"
          else
            echo "Signing ad-hoc: the dialogs read correctly, but every self-update asks again."
          fi
          for binary in \
            daemon/target/release/spawnd \
            daemon/target/release/spawn-worker \
            daemon/target/x86_64-apple-darwin/release/spawnd \
            daemon/target/x86_64-apple-darwin/release/spawn-worker
          do
            if [ "$identity" = "-" ]; then
              codesign --force --sign - "$binary"
            else
              codesign --force --timestamp --sign "$identity" "$binary"
            fi
            codesign --verify --verbose=2 "$binary"
            # The whole point of the step. If either line is missing the build
            # would ship binaries that ask for consent anonymously, so fail
            # here rather than find out from a user.
            codesign -dv --verbose=2 "$binary" 2>&1 | tee "$RUNNER_TEMP/sig.txt"
            grep -q 'Identifier=dev\.spawnd\.daemon' "$RUNNER_TEMP/sig.txt"
            grep -q 'Info\.plist entries=' "$RUNNER_TEMP/sig.txt"
          done

      - name: Stage binaries
        run: |
          set -eu
          mkdir -p out
          cp daemon/target/release/spawnd                          out/spawnd-aarch64-apple-darwin
          cp daemon/target/release/spawn-worker                    out/spawn-worker-aarch64-apple-darwin
          cp daemon/target/x86_64-apple-darwin/release/spawnd       out/spawnd-x86_64-apple-darwin
          cp daemon/target/x86_64-apple-darwin/release/spawn-worker out/spawn-worker-x86_64-apple-darwin

      - name: Upload darwin artifacts
        uses: actions/upload-artifact@v4
        with:
          name: prebuilt-darwin
          path: out/
          retention-days: 1
          if-no-files-found: error

  linux-x86_64:
    runs-on: [self-hosted, Linux, X64, spawn-linux-build]
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            daemon/target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('daemon/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-

      - name: Build x86_64 (x86_64-unknown-linux-gnu)
        working-directory: daemon
        run: cargo build --release --locked --bin spawnd --bin spawn-worker

      # The diagnostics variant: the same tree, release codegen with symbols
      # kept and debug logging on by default, published beside the release
      # pair under a suffixed asset name so a host that runs it keeps getting
      # it (the daemon follows its own variant through the signed manifest's
      # `variants` map). Built in this job, from this checkout, so it can
      # never be a different tree from the pair next to it; built for this
      # target first because it is the one dream runs. See "The diagnostics
      # variant" in docs/RELEASE.md.
      - name: Build x86_64 diagnostics variant
        working-directory: daemon
        run: cargo build --profile diagnostics --features diagnostics --locked --bin spawnd --bin spawn-worker

      - name: Stage binaries
        run: |
          set -eu
          # shellcheck source=scripts/release-lib.sh
          source scripts/release-lib.sh
          mkdir -p out
          cp daemon/target/release/spawnd       out/spawnd-x86_64-unknown-linux-gnu
          cp daemon/target/release/spawn-worker out/spawn-worker-x86_64-unknown-linux-gnu
          cp daemon/target/diagnostics/spawnd \
            "out/$(prebuilt_variant_asset_name linux-x86_64 x86_64-unknown-linux-gnu spawnd diagnostics)"
          cp daemon/target/diagnostics/spawn-worker \
            "out/$(prebuilt_variant_asset_name linux-x86_64 x86_64-unknown-linux-gnu spawn-worker diagnostics)"
          # The variant must say what it is. The manifest will name its
          # version as the release version plus `.diagnostics`, and the
          # updater refuses a binary that reports anything else — so prove
          # here, on the built binaries, that the two agree.
          version="$(daemon/target/release/spawnd --version | awk '{print $2}')"
          variant_version="$(daemon/target/diagnostics/spawnd --version | awk '{print $2}')"
          test -n "$version"
          test "$variant_version" = "$(prebuilt_variant_version "$version" diagnostics)"
          test "$(daemon/target/diagnostics/spawn-worker --version | awk '{print $2}')" = "$variant_version"

      - name: Upload linux-x86_64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: prebuilt-linux-x86_64
          path: out/
          retention-days: 1
          if-no-files-found: error

  linux-aarch64:
    runs-on: [self-hosted, Linux, ARM64, spawn-linux-arm64]
    timeout-minutes: 40
    # Preserve the existing non-fatal ARM64 build-result policy. An offline
    # runner still queues this job, so provision this pool before releasing.
    # Missing platform artifacts remain visible at deploy and verification.
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            daemon/target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('daemon/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-

      - name: Build arm64 (aarch64-unknown-linux-gnu)
        working-directory: daemon
        run: cargo build --release --locked --bin spawnd --bin spawn-worker

      - name: Stage binaries
        run: |
          set -eu
          mkdir -p out
          cp daemon/target/release/spawnd       out/spawnd-aarch64-unknown-linux-gnu
          cp daemon/target/release/spawn-worker out/spawn-worker-aarch64-unknown-linux-gnu

      - name: Upload linux-aarch64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: prebuilt-linux-aarch64
          path: out/
          retention-days: 1
          if-no-files-found: error

  windows-x86_64:
    if: github.ref == 'refs/heads/master'
    runs-on: [self-hosted, Windows, X64, spawn-windows-release]
    environment: windows-code-signing
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust (stable MSVC)
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            daemon/target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('daemon/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-

      - name: Build x86_64 (x86_64-pc-windows-msvc)
        working-directory: daemon
        run: cargo build --release --locked --target x86_64-pc-windows-msvc --bin spawnd --bin spawn-worker

      - name: Stage binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item daemon/target/x86_64-pc-windows-msvc/release/spawnd.exe `
            out/spawnd-x86_64-pc-windows-msvc.exe
          Copy-Item daemon/target/x86_64-pc-windows-msvc/release/spawn-worker.exe `
            out/spawn-worker-x86_64-pc-windows-msvc.exe

      # An entirely absent credential set intentionally leaves branch-protected
      # builds unsigned while Key Vault signing is being provisioned. A partial
      # configuration is an error; once provisioned, signing and verification
      # below are hard gates and happen before checksums are constructed.
      - name: Configure Authenticode signing
        id: signing-config
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_KEY_VAULT_URL: ${{ vars.AZURE_KEY_VAULT_URL }}
          AZURE_KEY_VAULT_CERTIFICATE: ${{ vars.AZURE_KEY_VAULT_CERTIFICATE }}
          CODE_SIGN_TIMESTAMP_URL: ${{ vars.CODE_SIGN_TIMESTAMP_URL }}
          WINDOWS_SIGNING_SUBJECT: ${{ vars.WINDOWS_SIGNING_SUBJECT }}
        run: |
          $secrets = @(
            $env:AZURE_CLIENT_ID,
            $env:AZURE_TENANT_ID,
            $env:AZURE_SUBSCRIPTION_ID
          )
          $required = $secrets + @(
            $env:AZURE_KEY_VAULT_URL,
            $env:AZURE_KEY_VAULT_CERTIFICATE,
            $env:CODE_SIGN_TIMESTAMP_URL,
            $env:WINDOWS_SIGNING_SUBJECT
          )
          if (($secrets | Where-Object { $_ }).Count -eq 0) {
            'enabled=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host 'Azure credentials are absent; keeping the Windows pair unsigned.'
            Write-Host 'Unsigned Windows binaries are not uploaded on master, so they cannot reach prebuilt-latest.'
          } elseif (($required | Where-Object { $_ }).Count -ne $required.Count) {
            throw 'Windows signing is partially configured; provide all Azure secrets and signing variables.'
          } else {
            'enabled=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Azure login
        if: steps.signing-config.outputs.enabled == 'true'
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Authenticode-sign daemon pair
        if: steps.signing-config.outputs.enabled == 'true'
        shell: pwsh
        env:
          AZURE_KEY_VAULT_URL: ${{ vars.AZURE_KEY_VAULT_URL }}
          AZURE_KEY_VAULT_CERTIFICATE: ${{ vars.AZURE_KEY_VAULT_CERTIFICATE }}
          CODE_SIGN_TIMESTAMP_URL: ${{ vars.CODE_SIGN_TIMESTAMP_URL }}
        run: |
          dotnet tool install --global AzureSignTool --version 7.0.1
          $files = @(
            '${{ github.workspace }}\out\spawnd-x86_64-pc-windows-msvc.exe',
            '${{ github.workspace }}\out\spawn-worker-x86_64-pc-windows-msvc.exe'
          )
          foreach ($file in $files) {
            azuresigntool sign `
              -kvu $env:AZURE_KEY_VAULT_URL `
              -kvm `
              -kvc $env:AZURE_KEY_VAULT_CERTIFICATE `
              -fd sha256 `
              -tr $env:CODE_SIGN_TIMESTAMP_URL `
              -td sha256 `
              $file
            if ($LASTEXITCODE -ne 0) { throw "AzureSignTool failed for $file" }
          }

      - name: Verify Authenticode signatures
        if: steps.signing-config.outputs.enabled == 'true'
        shell: pwsh
        env:
          WINDOWS_SIGNING_SUBJECT: ${{ vars.WINDOWS_SIGNING_SUBJECT }}
        run: |
          $files = @(
            'out\spawnd-x86_64-pc-windows-msvc.exe',
            'out\spawn-worker-x86_64-pc-windows-msvc.exe'
          )
          $expectedSubject = $env:WINDOWS_SIGNING_SUBJECT
          if (-not $expectedSubject) { throw 'WINDOWS_SIGNING_SUBJECT is empty' }
          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
            -Filter signtool.exe -File -Recurse |
            Where-Object FullName -Match '\\x64\\' |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signTool) { throw 'Windows SDK signtool.exe was not found' }

          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file
            if ($signature.Status -ne 'Valid') {
              throw "$file Authenticode status is $($signature.Status): $($signature.StatusMessage)"
            }
            if ($signature.SignerCertificate.Subject -ne $expectedSubject) {
              throw "$file publisher is '$($signature.SignerCertificate.Subject)', expected '$expectedSubject'"
            }
            if (-not $signature.TimeStamperCertificate) {
              throw "$file has no Authenticode timestamp certificate"
            }
            & $signTool.FullName verify /pa /all /v $file
            if ($LASTEXITCODE -ne 0) { throw "signtool verification failed for $file" }
          }

      # Fail closed. `prebuilt-latest` is the prod install channel, so an
      # unsigned pair must never enter it: off master an unsigned build is a
      # dev artifact and still uploads, but on master an absent Azure identity
      # means Windows is simply missing from the release — the same graceful
      # degradation linux-aarch64 already has, loud at deploy and verify time —
      # rather than silently shipping unsigned .exes to users.
      - name: Upload windows-x86_64 artifacts
        if: steps.signing-config.outputs.enabled == 'true' || github.ref != 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: prebuilt-windows-x86_64
          path: out/
          retention-days: 1
          if-no-files-found: error

  # Assemble every platform's binaries into one checksummed rolling prerelease.
  # deploy always pulls `prebuilt-latest`; since it only changes when the daemon
  # changes, it always reflects current daemon code. The single SHA256SUMS here
  # is the source of truth: deploy verifies against it before scp'ing to prod,
  # and the installer pins the same hashes — so the bytes CI built, prod serves.
  publish:
    needs: [macos, linux-x86_64, linux-aarch64, windows-x86_64]
    # The rolling release is the PROD install channel (deploy-prod.sh and the
    # installer both pull it), so only master may move it. A workflow_dispatch
    # on any other ref still builds and uploads run artifacts — the way to get
    # branch binaries for a dev host — but must never touch prebuilt-latest.
    if: github.ref == 'refs/heads/master'
    runs-on: [self-hosted, Linux, X64, spawn-linux-release]
    timeout-minutes: 15
    permissions:
      contents: write # move the rolling `prebuilt-latest` tag + upload assets
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: prebuilt-*
          merge-multiple: true
          path: out

      - name: Checksum + manifest
        run: |
          set -eu
          # shellcheck source=scripts/release-lib.sh
          source scripts/release-lib.sh
          tree="$(git rev-parse HEAD:daemon)"
          chmod +x out/spawnd-x86_64-unknown-linux-gnu
          version="$(out/spawnd-x86_64-unknown-linux-gnu --version | awk '{print $2}')"
          test -n "$version"
          # Every variant pair this release carries must be complete and must
          # report the version the manifest will advertise for it. The pairs a
          # release may never lose are checked for presence, so an assembly
          # that dropped one fails here instead of at deploy.
          for variant in "${PREBUILT_VARIANTS[@]}"; do
            for pair in "${PREBUILT_TARGETS[@]}"; do
              target="${pair%%:*}"
              triple="${pair##*:}"
              spawnd_asset="out/$(prebuilt_variant_asset_name "$target" "$triple" spawnd "$variant")"
              worker_asset="out/$(prebuilt_variant_asset_name "$target" "$triple" spawn-worker "$variant")"
              if [ ! -f "$spawnd_asset" ] && [ ! -f "$worker_asset" ]; then
                if prebuilt_variant_target_is_required "$variant" "$target"; then
                  echo "::error::the required $variant variant pair for $target is missing" >&2
                  exit 1
                fi
                continue
              fi
              test -f "$spawnd_asset"
              test -f "$worker_asset"
              if [ "$target" = linux-x86_64 ]; then
                chmod +x "$spawnd_asset"
                test "$("$spawnd_asset" --version | awk '{print $2}')" = \
                  "$(prebuilt_variant_version "$version" "$variant")"
              fi
            done
          done
          cd out
          # Deterministic ordering so the SHA256SUMS diff is stable build-to-build.
          sha256sum $(ls spawnd-* spawn-worker-* | sort) > SHA256SUMS
          echo "${GITHUB_SHA}" > COMMIT
          echo "$tree" > TREE
          echo "$version" > VERSION
          echo "----- prebuilt-latest SHA256SUMS -----"
          cat SHA256SUMS

      - name: Publish rolling prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release delete prebuilt-latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create prebuilt-latest out/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Prebuilt daemon (rolling)" \
            --notes "Auto-built from ${GITHUB_SHA}. Consumed by deploy-prod.sh; not for manual download. Verify prod with scripts/verify-prebuilts.sh." \
            --prerelease

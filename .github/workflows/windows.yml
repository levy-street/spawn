name: Windows

# windows-check runs native daemon checks/tests, a release build, desktop crate
# checks and an isolated installer smoke. Standard hosted compute is free for
# this public repository. Every master push needs a result: release compares
# against the deployed baseline, which may include earlier undeployed daemon
# changes even when this push only changes web files. PRs remain path-filtered.
# Dispatch with --ref BRANCH for both checks and unsigned packaging before merge.
"on":
  push:
    branches:
      - master
  pull_request:
    paths:
      - "daemon/**"
      - "desktop/**"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-check:
    name: windows-check
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust (stable MSVC)
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            daemon/target
            desktop/src-tauri/target
          key: cargo-check-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('daemon/Cargo.lock', 'desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-check-${{ runner.os }}-${{ runner.arch }}-

      - name: Check daemon binaries
        working-directory: daemon
        run: cargo check --locked --target x86_64-pc-windows-msvc --bin spawnd --bin spawn-worker

      - name: Clippy daemon
        working-directory: daemon
        run: cargo clippy --locked --target x86_64-pc-windows-msvc --all-targets -- -D warnings

      - name: Test daemon
        working-directory: daemon
        run: cargo test --locked --target x86_64-pc-windows-msvc

      - name: Stress concurrent RTC tests without trace logging
        if: ${{ !cancelled() }}
        working-directory: daemon
        run: |
          for ($iteration = 1; $iteration -le 20; $iteration++) {
            Write-Host "Concurrent RTC repetition $iteration of 20"
            cargo test --locked --target x86_64-pc-windows-msvc --bin spawnd rtc:: -- --test-threads=8
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Test SCTP stream lifecycle
        working-directory: daemon
        run: "cargo test --locked -p webrtc-sctp --lib stream::stream_test:: --target x86_64-pc-windows-msvc"

      # A plain crate check does not invoke tauri-cli or bundle an application;
      # WebView2 SDK installation belongs to the separate packaging workflow.
      - name: Check desktop crate
        working-directory: desktop/src-tauri
        run: cargo check --locked --target x86_64-pc-windows-msvc

      - name: Build daemon binaries for installer smoke
        working-directory: daemon
        run: cargo build --release --locked --target x86_64-pc-windows-msvc --bin spawnd --bin spawn-worker

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          cache-dependency-glob: server/uv.lock
          prune-cache: false

      - name: Install server dependencies
        working-directory: server
        run: |
          uv python install 3.13
          uv sync --frozen

      - name: Exercise Windows installer surface
        shell: pwsh
        run: |
          & ./scripts/smoke-install-prebuilt.ps1 `
            -SpawndPath daemon/target/x86_64-pc-windows-msvc/release/spawnd.exe `
            -WorkerPath daemon/target/x86_64-pc-windows-msvc/release/spawn-worker.exe

      # The release pair this job already built, kept rather than discarded, so a
      # dev deployment can serve `/install.ps1` before Windows is a real release.
      # `prebuilt.yml` owns the published Windows daemon and is gated to `master`
      # because that is where the signing environment is reachable; these are
      # deliberately NOT that. They carry no Authenticode signature and must
      # never be promoted into a release.
      - name: Keep the unsigned daemon pair for dev staging
        if: >-
          github.event_name == 'workflow_dispatch' ||
          contains(github.event.head_commit.message, '[package]')
        uses: actions/upload-artifact@v4
        with:
          name: spawn-daemon-windows-x86_64-UNSIGNED-do-not-publish
          path: |
            daemon/target/x86_64-pc-windows-msvc/release/spawnd.exe
            daemon/target/x86_64-pc-windows-msvc/release/spawn-worker.exe
          retention-days: 7
          if-no-files-found: error

  # Everything `desktop.yml` does on Windows except the signing, so the release
  # path is proved from a branch at all — the signing environment permits only
  # `master`, so `desktop.yml` cannot run here — and so that an installer exists
  # to run the handoff matrix against. What comes out is deliberately
  # UNSIGNED: it is a validation build, never a release artifact, and
  # publish-desktop.sh refuses a setup EXE with no certificate table.
  #
  # Packaging is explicitly requested with workflow_dispatch (including a
  # branch ref) or `[package]` in a master push commit message. This produces an
  # unsigned test installer; desktop.yml owns signed release packaging.
  windows-package:
    name: windows-package (unsigned rehearsal)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[package]')
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # A rehearsal build is for a dev deployment, so it must point at one.
      # Left unset it would default to production — an installer downloaded
      # from a dev server that talks to the live fleet, which is the exact
      # trap `SPAWN_DESKTOP_SERVER_ORIGIN` exists to close. Pointing it
      # elsewhere also takes it off the signed app channel, so it can never
      # update itself into the production app either.
      SPAWN_DESKTOP_SERVER_ORIGIN: ${{ vars.DEV_SERVER_ORIGIN || 'https://dev.spawnd.dev:8330' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Rust (stable MSVC)
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: cargo-package-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-package-${{ runner.os }}-${{ runner.arch }}-

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Check generated icons and build the wizard
        working-directory: desktop
        run: |
          npm run icons:check
          npm run build

      - name: Test the Windows desktop crate
        working-directory: desktop
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --target x86_64-pc-windows-msvc

      - name: Build the unbundled Windows application
        working-directory: desktop
        run: npm run tauri -- build --no-bundle --target x86_64-pc-windows-msvc

      - name: Bundle with NSIS
        working-directory: desktop
        run: npm run tauri -- bundle --bundles nsis --target x86_64-pc-windows-msvc

      - name: Name the unsigned installer and prove it is unsigned
        shell: pwsh
        run: |
          $bundle = '${{ github.workspace }}\desktop\src-tauri\target\x86_64-pc-windows-msvc\release\bundle\nsis'
          $files = @(Get-ChildItem $bundle -Filter '*-setup.exe')
          if ($files.Count -ne 1) { throw "Expected one NSIS installer, found $($files.Count)" }
          $version = (Get-Content '${{ github.workspace }}\desktop\src-tauri\tauri.conf.json' | ConvertFrom-Json).version
          $output = '${{ github.workspace }}\desktop\windows-rehearsal'
          New-Item -ItemType Directory -Force $output | Out-Null
          # The canonical release name is deliberately NOT used: nothing here may
          # be mistaken for, or promoted as, a release artifact.
          Write-Host "This build points at $env:SPAWN_DESKTOP_SERVER_ORIGIN"
          $name = "SPAWN-D_${version}_windows-x86_64-setup.UNSIGNED.exe"
          $canonical = Join-Path $output $name
          Move-Item $files[0].FullName $canonical
          $signature = Get-AuthenticodeSignature $canonical
          if ($signature.Status -ne 'NotSigned') {
            throw "This lane holds no signing identity, so the installer must be NotSigned; got $($signature.Status)"
          }
          $hash = (Get-FileHash -Algorithm SHA256 $canonical).Hash.ToLowerInvariant()
          Set-Content -Encoding utf8NoBOM (Join-Path $output 'SHA256SUMS') "$hash  $name"
          Write-Host "Unsigned rehearsal installer: $name ($hash)"

      - name: Upload the unsigned rehearsal installer
        uses: actions/upload-artifact@v4
        with:
          name: SPAWN-D-windows-x86_64-UNSIGNED-do-not-publish
          path: desktop/windows-rehearsal/*
          retention-days: 7
          if-no-files-found: error

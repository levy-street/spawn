name: Windows

# windows-check runs native daemon checks/tests, a release build, desktop crate
# checks and an isolated installer smoke. Standard hosted compute is free for
# this public repository. Every master push needs a result: release compares
# against the deployed baseline, which may include earlier undeployed daemon
# changes even when this push only changes web files. PRs remain path-filtered.
# Dispatch with --ref BRANCH for both checks and unsigned packaging before merge.
"on":
  push:
    branches:
      - master
  pull_request:
    paths:
      - "daemon/**"
      - "desktop/**"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-check:
    name: windows-check
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust (stable MSVC)
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            daemon/target
            desktop/src-tauri/target
          key: cargo-check-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('daemon/Cargo.lock', 'desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-check-${{ runner.os }}-${{ runner.arch }}-

      - name: Test daemon
        working-directory: daemon
        run: cargo test --locked --target x86_64-pc-windows-msvc --bin spawnd rtc::pair::tests::multiple_sessions_share_one_peer_and_teardown_is_local -- --exact --nocapture

      - name: Repeat shared session closure
        if: ${{ !cancelled() }}
        working-directory: daemon
        run: |
          for ($iteration = 1; $iteration -le 20; $iteration++) {
            cargo test --locked --target x86_64-pc-windows-msvc --bin spawnd rtc::pair::tests::multiple_sessions_share_one_peer_and_teardown_is_local -- --exact --nocapture
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

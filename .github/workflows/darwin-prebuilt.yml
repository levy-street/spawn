name: darwin-prebuilt

# Build + test the daemon on real macOS and publish signed-by-toolchain
# (ad-hoc) Darwin binaries as a rolling prerelease that deploy-prod.sh pulls
# onto the server. Gated to daemon changes so it rarely spends macOS minutes
# (billed 10x on private repos); free entirely once the repo is public.
"on":
  push:
    branches:
      - master
    paths:
      - "daemon/**"
      - ".github/workflows/darwin-prebuilt.yml"
  workflow_dispatch:

concurrency:
  group: darwin-prebuilt-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # move the rolling `prebuilt-latest` tag + upload assets

jobs:
  build:
    runs-on: macos-14 # Apple Silicon; also cross-builds x86_64 from here
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust (stable + x86_64 target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            daemon/target
          key: cargo-macos-${{ hashFiles('daemon/Cargo.lock') }}
          restore-keys: |
            cargo-macos-

      # Runs the full daemon suite on real macOS — this is what catches
      # macOS-only regressions like the sun_path socket bug before they ship.
      # Non-blocking for now: the worker integration tests set a long temp
      # SPAWND_WORKER_DIR that itself overflows sun_path on macOS, so this is
      # expected red until those tests are hardened (tracked follow-up). Kept
      # visible so we get the signal; flip to a hard gate once green.
      - name: Test on macOS
        working-directory: daemon
        continue-on-error: true
        run: cargo test --locked

      - name: Build arm64 (aarch64-apple-darwin)
        working-directory: daemon
        run: cargo build --release --locked --bin spawnd --bin spawn-worker

      - name: Build x86_64 (cross)
        working-directory: daemon
        run: cargo build --release --locked --target x86_64-apple-darwin --bin spawnd --bin spawn-worker

      - name: Stage assets + checksums
        run: |
          set -eu
          mkdir -p out
          cp daemon/target/release/spawnd                     out/spawnd-aarch64-apple-darwin
          cp daemon/target/release/spawn-worker               out/spawn-worker-aarch64-apple-darwin
          cp daemon/target/x86_64-apple-darwin/release/spawnd out/spawnd-x86_64-apple-darwin
          cp daemon/target/x86_64-apple-darwin/release/spawn-worker out/spawn-worker-x86_64-apple-darwin
          ( cd out && shasum -a 256 spawnd-* spawn-worker-* > SHA256SUMS )
          echo "${GITHUB_SHA}" > out/COMMIT
          cat out/SHA256SUMS

      # One rolling prerelease, retargeted to this commit each build. deploy
      # always pulls `prebuilt-latest`; since it only changes when the daemon
      # changes, it always reflects current daemon code.
      - name: Publish rolling prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release delete prebuilt-latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create prebuilt-latest out/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Darwin prebuilt (rolling)" \
            --notes "Auto-built from ${GITHUB_SHA}. Consumed by deploy-prod.sh; not for manual download." \
            --prerelease

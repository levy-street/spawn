name: Native connection acceptance

"on":
  workflow_call:
    inputs:
      candidate:
        description: Exact candidate commit to build and exercise
        required: true
        type: string
      baseline:
        description: Resolved deployed baseline commit for acceptance provenance
        required: true
        type: string
  workflow_dispatch:
    inputs:
      candidate:
        description: Exact candidate commit to build and exercise (full SHA)
        required: true
        type: string
      baseline:
        description: Resolved deployed baseline commit (full SHA; provenance only)
        required: true
        type: string

permissions:
  contents: read

jobs:
  native:
    name: Native ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ios
            runner: macos-15
            client-host: 127.0.0.1
          - platform: android
            runner: ubuntu-24.04
            client-host: 10.0.2.2
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      NATIVE_PLATFORM: ${{ matrix.platform }}
    steps:
      - name: Validate candidate
        env:
          CANDIDATE: ${{ inputs.candidate }}
          BASELINE: ${{ inputs.baseline }}
        run: |
          python3 - <<'PY'
          import os, re
          assert re.fullmatch(r"[0-9a-f]{40}", os.environ["CANDIDATE"]), "candidate must be a full commit SHA"
          assert re.fullmatch(r"[0-9a-f]{40}", os.environ["BASELINE"]), "baseline must be a full commit SHA"
          with open(os.environ["GITHUB_ENV"], "a") as env:
              for name, suffix in [("ACCEPTANCE_OUTPUT", "acceptance-native-" + os.environ["NATIVE_PLATFORM"]),
                                   ("ACCEPTANCE_READY", "native-ready.json"), ("ACCEPTANCE_BUILD", "native-app")]:
                  env.write(name + "=" + os.path.join(os.environ["RUNNER_TEMP"], suffix) + "\n")
          PY
      - name: Check out exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.candidate }}
          persist-credentials: false
      - name: Reserve hosted Android build and emulator disk space
        if: matrix.platform == 'android'
        timeout-minutes: 10
        run: python3 mobile/e2e/android-disk-preflight.py prepare
      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install Java
        if: matrix.platform == 'android'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          cache-dependency-glob: server/uv.lock
          prune-cache: false
      - name: Install local fixture dependencies
        working-directory: server
        run: |
          uv python install 3.13
          uv sync --frozen
      - name: Install disposable TURN server
        run: |
          if [[ "$RUNNER_OS" == macOS ]]; then
            brew install coturn
          else
            sudo apt-get update
            sudo apt-get install -y coturn
            sudo systemctl stop coturn || true
          fi
      - name: Build candidate daemon and worker
        working-directory: daemon
        run: |
          if [[ "$NATIVE_PLATFORM" == android ]]; then
            python3 ../mobile/e2e/android-disk-preflight.py build
          fi
          cargo build --locked --bin spawnd --bin spawn-worker
      - name: Verify real fixture integration before native build
        run: server/.venv/bin/python scripts/test-native-acceptance.py --integration
      - name: Prepare isolated acceptance API and relay
        env:
          CLIENT_HOST: ${{ matrix.client-host }}
          BASELINE: ${{ inputs.baseline }}
        run: |
          mkdir -p "$ACCEPTANCE_OUTPUT"
          server/.venv/bin/python scripts/native-acceptance-fixture.py \
            --output "$ACCEPTANCE_OUTPUT" --ready-file "$ACCEPTANCE_READY" \
            --client-host "$CLIENT_HOST" --port 18100 --transport relay --timeout 7200 \
            --baseline "$BASELINE" \
            --daemon "$GITHUB_WORKSPACE/daemon/target/debug/spawnd" \
            > "$ACCEPTANCE_OUTPUT/fixture.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/native-fixture.pid"
          python3 - <<'PY'
          import json, os, pathlib, time, urllib.request
          ready = pathlib.Path(os.environ["ACCEPTANCE_READY"])
          for attempt in range(120):
              if ready.exists():
                  break
              time.sleep(1)
          else:
              raise SystemExit("Isolated acceptance fixture failed to become ready")
          config = json.loads(ready.read_text())
          request = urllib.request.Request("http://127.0.0.1:18100/__acceptance/config",
              headers={"X-Acceptance-Token": config["token"]})
          with urllib.request.urlopen(request, timeout=15) as response:
              build_config = json.load(response)
          assert build_config["candidateCommit"] == config["candidateCommit"]
          assert build_config["runId"] == config["runId"]
          for secret in [config["token"],
                         *[server.get("credential", "") for server in config["iceServers"]]]:
              if secret:
                  print("::add-mask::" + secret)
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write("SPAWN_ACCEPTANCE_API_URL=" + config["apiUrl"] + "\n")
              env.write("SPAWN_ACCEPTANCE_TOKEN=" + config["token"] + "\n")
          PY
      - name: Reclaim Android fixture compilation outputs
        if: matrix.platform == 'android'
        timeout-minutes: 5
        working-directory: daemon
        # Readiness above follows copying both executables into the fixture's
        # private bin directory; later activation no longer uses target/.
        run: cargo clean
      - name: Build native Release acceptance shell
        env:
          NATIVE_PLATFORM: ${{ matrix.platform }}
        run: |
          if [[ "$NATIVE_PLATFORM" == android ]]; then
            python3 mobile/e2e/android-disk-preflight.py build
          fi
          bash mobile/e2e/build-native-acceptance.sh "$NATIVE_PLATFORM" "$ACCEPTANCE_BUILD"
      - name: Reclaim disposable Android build space for the emulator
        if: matrix.platform == 'android'
        timeout-minutes: 5
        run: |
          python3 mobile/e2e/compact-android-build.py "$ACCEPTANCE_BUILD" "$RUNNER_TEMP"
          python3 mobile/e2e/android-disk-preflight.py emulator
      - name: Run iOS simulator acceptance
        if: matrix.platform == 'ios'
        run: |
          python3 mobile/e2e/run-native-acceptance.py --platform ios \
            --build "$ACCEPTANCE_BUILD" --ready-file "$ACCEPTANCE_READY" \
            --output "$ACCEPTANCE_OUTPUT" --timeout 1800
      - name: Enable Android emulator acceleration
        if: matrix.platform == 'android'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android emulator acceptance
        if: matrix.platform == 'android'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 mobile/e2e/run-native-acceptance.py --platform android --build "$ACCEPTANCE_BUILD" --ready-file "$ACCEPTANCE_READY" --output "$ACCEPTANCE_OUTPUT" --timeout 1800
      - name: Stop isolated fixture
        id: stop_fixture
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/native-fixture.pid" ]]; then
            fixture_pid="$(cat "$RUNNER_TEMP/native-fixture.pid")"
            kill "$fixture_pid" 2>/dev/null || true
            for attempt in {1..45}; do
              if ! kill -0 "$fixture_pid" 2>/dev/null; then
                break
              fi
              sleep 1
            done
            if kill -0 "$fixture_pid" 2>/dev/null; then
              echo 'Isolated fixture did not finish cleanup within 45 seconds'
              exit 1
            fi
          fi
      - name: Preserve native acceptance evidence
        id: sanitize
        if: always() && steps.stop_fixture.outcome == 'success'
        run: |
          python3 mobile/e2e/sanitize-native-evidence.py \
            --output "$ACCEPTANCE_OUTPUT" --ready-file "$ACCEPTANCE_READY"
      - name: Upload native acceptance evidence
        if: always() && steps.sanitize.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: acceptance-native-${{ matrix.platform }}
          path: ${{ env.ACCEPTANCE_OUTPUT }}
          if-no-files-found: warn
          retention-days: 14

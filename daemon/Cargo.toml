[package]
name = "spawnd"
version = "0.1.0"
edition = "2021"
description = "spawn daemon — runs CLI coding agents on a host on behalf of a spawn server"
license = "MIT OR Apache-2.0"

[workspace]
members = ["vendor/sctp", "vendor/ice"]
exclude = ["vendor/webrtc"]
default-members = ["."]
resolver = "2"

[lib]
name = "spawnd"
path = "src/lib.rs"

[[bin]]
name = "spawnd"
path = "src/main.rs"

[[bin]]
name = "spawn-worker"
path = "src/bin/spawn-worker.rs"

[dependencies]
# async runtime
tokio = { version = "1.42", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

# websocket client (rustls — no system openssl required)
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tungstenite = { version = "0.24", default-features = false }

# http client for device-code login
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# CLI
clap = { version = "4.5", features = ["derive", "env"] }
anstream = "1.0"
anstyle = "1.0"
qrcode = { version = "0.14", default-features = false }

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# errors / logging
anyhow = "1"
thiserror = "1"
arc-swap = "1"
tracing = "0.1"
tracing-log = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# pty + bytes
portable-pty = "0.8"
bytes = "1"
base64 = "0.22"
sha2 = "0.10"
ed25519-dalek = "2.2"
curve25519-dalek = "4.1.3"
webrtc = "0.17"
cap-std = "4"
cap-fs-ext = "4"

# host capacity telemetry (host_metrics.rs). `system` only: spawnd never reads
# disks, networks, components, or the process table through this crate.
sysinfo = { version = "0.39", default-features = false, features = ["system"] }

# session worker: encrypted scrollback at rest + memory hygiene
chacha20poly1305 = "0.10"
zeroize = "1"
getrandom = "0.2"

# misc
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
dirs = "5"
hostname = "0.4"
socket2 = "0.5"
alacritty_terminal = { version = "0.26", default-features = false }

[target.'cfg(unix)'.dependencies]
# "term" is for the raw-mode guard behind the arrow-key picker in tui.rs.
nix = { version = "0.29", features = ["signal", "process", "mman", "fs", "user", "term"] }
rustix = { version = "1", features = ["fs", "process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Environment",
    "Win32_System_JobObjects",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
# The diagnostics variant: the same daemon with debug logging on by default,
# symbols kept for backtraces, and `.diagnostics` in its version so a status
# line always says which one is running. It is what dream runs permanently,
# so an attach failure or a held lock is attributed the first time it happens
# rather than reconstructed from an info-level log afterwards.
diagnostics = []

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.42", features = ["test-util"] }

# Remove this override after a published webrtc-sctp release contains the
# receiver zero-window re-admission fix from webrtc-rs/rtc#201 and the stream
# reset notification fix documented in CLAUDE.md.
[patch.crates-io]
webrtc-sctp = { path = "vendor/sctp" }
# Keep closed channels out of the shared parent's live registry, retaining
# cumulative close stats and stream-ID reservations. See vendor/webrtc/PATCHES.md.
webrtc = { path = "vendor/webrtc" }
# A temporary unreachable UDP route during ICE restart is packet loss, not
# the end of the DTLS/SCTP association. See vendor/ice/PATCHES.md.
webrtc-ice = { path = "vendor/ice" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Release codegen with line tables kept, so a panic in the diagnostics
# variant carries a readable backtrace. Build with
# `--profile diagnostics --features diagnostics`.
[profile.diagnostics]
inherits = "release"
strip = false
debug = 1
